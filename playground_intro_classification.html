<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro to Classification</title>
<link rel="stylesheet" href="pg_style.css?v=24">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="day4_data.js"></script>
<style>
  /* intro-classification — โครง/ฟอนต์ = .distcls กลาง (เหมือน 1-D Bayes); ตาราง = .mtab กลาง 15px */
  .layout{align-items:start}
  .pg.distcls .canvasbox{height:clamp(210px,28vh,250px)}
  .distcls .stage{gap:6px}
  /* bivariate = แบบ 2-D Bayes: plot จตุรัส ซ้าย · confusion matrix ใหญ่ กินพื้นที่ที่เหลือ ขวา */
  .toprow{display:flex;gap:26px;align-items:center}
  .toprow .canvasbox{flex:1 1 auto;width:auto;min-width:0;margin:0}
  .toprow.bi .canvasbox{flex:none;aspect-ratio:1/1;width:auto}
  .cmwrap{display:none;flex:1 1 auto;min-width:0}
  .toprow.bi .cmwrap{display:block}
  .cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;font-size:15px;width:100%;align-items:center}
  .cm .hh{display:flex;align-items:center;justify-content:center;color:#555;font-size:19px;padding:2px 6px;text-align:center;white-space:nowrap}
  .cm .cell{border-radius:14px;padding:26px 8px;text-align:center}.cm .cell b{font-size:24px;display:block;font-variant-numeric:tabular-nums;font-weight:400}.cm .cell span{font-size:17px}
  .cm .katex{font-size:1em}
  .tp{background:#FBE9E4;color:#8A3B2C}.fn{background:#FAEFD6;color:#8A6510}.fp{background:#E3F1EE;color:#2E7D70}.tn{background:#E9F0F8;color:#3F6E99}
  .panel{max-height:calc(100vh - 96px);overflow-y:auto;overflow-x:hidden}
  .seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .seg2 button{flex:1 1 auto;font:inherit;font-size:14px;padding:6px 8px;border:0;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
  .seg2 button.on{background:var(--navy);color:#fff}
  .seg2 .katex{font-size:1em}
  .tgls{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .hid{visibility:hidden}
  /* ตาราง: .mtab กลาง — 15px, ทุกเซลล์ KaTeX น้ำหนัก 400, หัว/ตัวแนวเดียวกัน */
  .distcls .below{min-height:0;padding:6px 14px 8px}
  .tblbox{min-width:0;width:100%}
  .pg .mtab{margin:0}
  .pg .mtab th,.pg .mtab td{padding:7px 10px;font-size:15px;vertical-align:top;line-height:1.45}
  .pg .mtab th{white-space:normal}
  .pg .mtab th.r{text-align:right}
  .pg .mtab td{font-weight:400;color:var(--ink);font-variant-numeric:normal;text-align:left}
  .pg .mtab td:first-child{white-space:nowrap}
  .pg .mtab td:last-child{text-align:right}
  .pg .mtab tr.sel th,.pg .mtab tr.sel td{background:#f4f7fb}
  .pg .mtab th .katex,.pg .mtab td .katex{font-size:1em;line-height:1.2;vertical-align:baseline}
  .pg .mtab th.r .katex,.pg .mtab td:last-child .katex{display:block;text-align:right}
  .pg .mtab th.r .katex-html,.pg .mtab td:last-child .katex-html{display:inline-block}
  .pg .mtab .ln{display:block}
  .pg .mtab .ln .katex{white-space:nowrap}
  /* Example tab: ตารางข้อมูล PSA (แบบสไลด์) — คอลัมน์ Cancer / Healthy / สถิติ */
  .extab{display:none;width:100%;border-collapse:collapse;font-size:15px}
  .extab th,.extab td{padding:3px 10px;text-align:center;font-weight:400;color:var(--ink);line-height:1.35}
  .extab th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  .extab td.st{text-align:left;padding-left:16px;border-left:1px solid var(--line);vertical-align:top}
  .extab td:last-child,.extab th:last-child{text-align:left}
  .extab .katex{font-size:1em}
  .extab .ln{display:block;white-space:nowrap}
  /* summary tab */
  .summary{display:none;flex-direction:column;gap:16px;min-height:0;overflow:visible}
  .summary.on{display:flex;flex:1}
  .secttl{font-size:16px;font-weight:600;color:var(--navy)}
  .found{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .frow{display:flex;align-items:center;gap:16px}
  .frow .fl{flex:0 0 176px;font-size:14px;color:var(--muted);text-align:right}
  .frow .fe{flex:1;font-size:15px;overflow-x:auto;overflow-y:hidden}
  .stab{border-collapse:separate;border-spacing:8px;width:100%}
  .stab th{font-size:13px;color:var(--muted);font-weight:600;padding:4px}
  .stab td{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;vertical-align:top;width:50%}
  .stab td .tag{font-size:13px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:8px;color:#fff}
  .stab td .eq{font-size:15px;margin:6px 0}
  .stab td .note{font-size:13px;color:var(--muted);margin-top:6px}
  .stab td .note>span{display:inline-block;margin-right:.26em}
  .ref{font-size:13px;color:#9ca3af}
  @media(max-width:640px){.frow{flex-direction:column;align-items:flex-start;gap:2px}.frow .fl{text-align:left;flex:none}}
</style>
</head>
<body class="pg distcls">
<div class="wrap">
  <div class="hdr"><h1 id="h1">Intro to Classification</h1><div class="tabs" id="tabs"></div></div>

  <!-- ===== interactive ===== -->
  <div class="layout" id="mainPanel">
    <div class="stage">
      <div class="toprow">
        <div class="canvasbox"><canvas id="cv"></canvas></div>
        <div class="cmwrap" id="cmwrap"><div class="cm">
          <div class="hh"></div><div class="hh" id="ch-pp"></div><div class="hh" id="ch-pn"></div>
          <div class="hh" id="ch-ap"></div><div class="cell tp"><b id="c-tp">0</b><span id="cs-tp"></span></div><div class="cell fn"><b id="c-fn">0</b><span id="cs-fn"></span></div>
          <div class="hh" id="ch-an"></div><div class="cell fp"><b id="c-fp">0</b><span id="cs-fp"></span></div><div class="cell tn"><b id="c-tn">0</b><span id="cs-tn"></span></div>
        </div></div>
      </div>
      <div class="classleg" id="classleg"></div>
      <div class="below">
        <div class="tblbox">
          <table class="mtab" id="modtab">
            <thead><tr><th id="th-m"></th><th id="th-f"></th><th id="th-r"></th><th class="r" id="th-e"></th></tr></thead>
            <tbody id="modbody"></tbody>
          </table>
          <table class="extab" id="extab"><thead><tr><th id="ex-hp"></th><th id="ex-hn"></th><th id="ex-hs"></th></tr></thead><tbody id="exbody"></tbody></table>
        </div>
      </div>
    </div>

    <!-- CONTROL -->
    <div class="panel">
      <div id="grp-ex"><div class="dhd" id="hd-ex"></div>
      <div class="dgrid">
        <div class="drow" id="row-x0"><span class="dlab" id="lbl-x0"></span><input type="range" id="Rx0" min="0.3" max="4.7" step="0.1" value="2.6"><input class="num" type="number" id="Nx0" min="0.3" max="4.7" step="0.1" value="2.6"></div>
      </div></div>
      <div id="grp-pos"><div class="dhd" id="hd-pos"></div>
      <div class="dgrid">
        <div class="drow" id="row-mu1"><span class="dlab" id="lbl-mu1"></span><input type="range" id="Rmu1" min="1" max="9" step="0.1" value="6.0"><input class="num" type="number" id="Nmu1" min="1" max="9" step="0.1" value="6.0"></div>
        <div class="drow" id="row-muy1"><span class="dlab" id="lbl-muy1"></span><input type="range" id="Rmuy1" min="1" max="9" step="0.1" value="6.0"><input class="num" type="number" id="Nmuy1" min="1" max="9" step="0.1" value="6.0"></div>
        <div class="drow" id="row-s1"><span class="dlab" id="lbl-s1"></span><input type="range" id="Rs1" min="0.4" max="2.5" step="0.1" value="1.0"><input class="num" type="number" id="Ns1" min="0.4" max="2.5" step="0.1" value="1.0"></div>
      </div></div>
      <div id="grp-neg"><div class="dhd" id="hd-neg"></div>
      <div class="dgrid">
        <div class="drow" id="row-mu0"><span class="dlab" id="lbl-mu0"></span><input type="range" id="Rmu0" min="1" max="9" step="0.1" value="3.0"><input class="num" type="number" id="Nmu0" min="1" max="9" step="0.1" value="3.0"></div>
        <div class="drow" id="row-muy0"><span class="dlab" id="lbl-muy0"></span><input type="range" id="Rmuy0" min="1" max="9" step="0.1" value="3.0"><input class="num" type="number" id="Nmuy0" min="1" max="9" step="0.1" value="3.0"></div>
        <div class="drow" id="row-s0"><span class="dlab" id="lbl-s0"></span><input type="range" id="Rs0" min="0.4" max="2.5" step="0.1" value="1.0"><input class="num" type="number" id="Ns0" min="0.4" max="2.5" step="0.1" value="1.0"></div>
      </div></div>
      <div id="grp-ds"><div class="dhd" id="hd-ds"></div>
      <div class="seg2" id="dsSeg"><button data-ds="0" id="ds-0" class="on"></button><button data-ds="1" id="ds-1"></button></div></div>
      <div id="grp-share"><div class="dhd" id="hd-share"></div>
      <div class="dgrid">
        <div class="drow" id="row-p1"><span class="dlab" id="lbl-p1"></span><input type="range" id="Rp1" min="0.05" max="0.95" step="0.01" value="0.50"><input class="num" type="number" id="Np1" min="0.05" max="0.95" step="0.01" value="0.50"></div>
        <div class="drow" id="row-sev"><span class="dlab" id="lbl-sev"></span><input type="range" id="Rsev" min="0" max="2" step="0.1" value="1.0"><input class="num" type="number" id="Nsev" min="0" max="2" step="0.1" value="1.0"></div>
        <div class="drow" id="row-n"><span class="dlab" id="lbl-n"></span><input type="range" id="Rn" min="20" max="400" step="10" value="120"><input class="num" type="number" id="Nn" min="20" max="400" step="10" value="120"></div>
      </div></div>
      <div id="grp-model">
      <div class="dhd" id="hd-model"></div>
      <div class="seg2" id="modelSeg">
        <button data-m="logistic" id="sb-logistic" class="on"></button><button data-m="nb" id="sb-nb"></button><button data-m="knn" id="sb-knn"></button><button data-m="tree" id="sb-tree"></button>
      </div>
      <div class="dhd" id="hd-hp"></div>
      <div class="dgrid" id="grid-hp">
        <div class="drow" id="row-k"><span class="dlab" id="lbl-k"></span><input type="range" id="Rk" min="1" max="31" step="2" value="7"><input class="num" type="number" id="Nk" min="1" max="31" step="2" value="7"></div>
        <div class="drow" id="row-depth"><span class="dlab" id="lbl-depth"></span><input type="range" id="Rdepth" min="1" max="6" step="1" value="1"><input class="num" type="number" id="Ndepth" min="1" max="6" step="1" value="1"></div>
        <div class="drow hid" id="row-hpblank"><span class="dlab">&nbsp;</span><input type="range" disabled><input class="num" type="number" disabled></div>
      </div>
      <div class="tgls"><button class="primary" id="resample" style="width:100%"></button></div>
      </div>
    </div>
  </div>

  <!-- ===== summary ===== -->
  <div class="summary" id="summaryPanel">
    <div class="secttl" id="s-found"></div>
    <div class="found">
      <div class="frow"><span class="fl" id="fl-target"></span><span class="fe" id="fe-target"></span></div>
      <div class="frow"><span class="fl" id="fl-rule"></span><span class="fe" id="fe-rule"></span></div>
      <div class="frow"><span class="fl" id="fl-bayes"></span><span class="fe" id="fe-bayes"></span></div>
      <div class="frow"><span class="fl" id="fl-est"></span><span class="fe" id="fe-est"></span></div>
    </div>
    <div class="secttl" id="s-split"></div>
    <table class="stab">
      <tr><th></th><th id="th-par"></th><th id="th-npar"></th></tr>
      <tr>
        <th id="th-disc" style="text-align:right;white-space:nowrap"></th>
        <td><span class="tag" style="background:#1e3a8a">Logistic</span><div class="eq" id="c-log"></div><div class="note" id="n-log"></div></td>
        <td><span class="tag" style="background:#1e3a8a">KNN</span><div class="eq" id="c-knn"></div><div class="note" id="n-knn"></div></td>
      </tr>
      <tr>
        <th id="th-gen" style="text-align:right;white-space:nowrap"></th>
        <td><span class="tag" style="background:#1e3a8a">Naive Bayes</span><div class="eq" id="c-nb"></div><div class="note" id="n-nb"></div></td>
        <td><span class="tag" style="background:#1e3a8a">Tree</span><div class="eq" id="c-tree"></div><div class="note" id="n-tree"></div></td>
      </tr>
    </table>
    <p class="ref" id="ref"></p>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---------- rng ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var MAXN=400, Z0=[],Z1=[],Z0y=[],Z1y=[],PERM=[];
  function regen(seed){var rng=mulberry32(seed),i;function g(){var u=rng()||1e-9,v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
    Z0=[];Z1=[];Z0y=[];Z1y=[];for(i=0;i<MAXN;i++){Z0.push(g());Z1.push(g());Z0y.push(g());Z1y.push(g());}
    PERM=[];for(i=0;i<1440;i++)PERM.push(i);for(i=1439;i>0;i--){var j=Math.floor(rng()*(i+1)),t=PERM[i];PERM[i]=PERM[j];PERM[j]=t;}}
  var seed=12345; regen(seed);
  function sig(z){return 1/(1+Math.exp(-z));}
  var SQ2PI=Math.sqrt(2*Math.PI);
  function npdf(x,m,s){return Math.exp(-0.5*((x-m)/s)*((x-m)/s))/(s*SQ2PI);}

  // ---------- Example (สไลด์ PSA): 14 ค่า — Cancer = positive, Healthy = negative ----------
  var EX={pos:[4.1,3.4,2.9,2.8,2.7,2.1,1.6],neg:[2.5,2.0,1.7,1.4,1.2,0.9,0.8],xmin:0,xmax:5,ax:'PSA (\u00b5g/L)  x'};
  function msd(a){var m=0,s=0,i;for(i=0;i<a.length;i++)m+=a[i];m/=a.length;for(i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return [m,Math.sqrt(s/(a.length-1))];}   // sample sd (n−1) เหมือนสไลด์
  EX.sp=msd(EX.pos);EX.sn=msd(EX.neg);EX.pip=EX.pos.length/(EX.pos.length+EX.neg.length);

  // ---------- PDM data (day4_data.js) ----------
  var D4IDX=(function(){var a=new Int32Array(128);if(typeof D4A64!=='undefined')for(var i=0;i<D4A64.length;i++)a[D4A64.charCodeAt(i)]=i;return a;})();
  var _cache={};
  function dcol(c,n){var out=new Float64Array(n),w=c.w,b=c.b,sc=Math.pow(10,c.dp);
    for(var i=0;i<n;i++){var x=0,o=i*w;for(var j=0;j<w;j++)x=x*64+D4IDX[b.charCodeAt(o+j)];out[i]=(x+c.lo)/sc;}return out;}
  function SET(name){if(_cache[name])return _cache[name];if(typeof D4RAW==='undefined'||!D4RAW[name])return null;
    var raw=D4RAW[name],n=raw.n,col={};Object.keys(raw.col).forEach(function(k){col[k]=dcol(raw.col[k],n);});
    var bad=new Uint8Array(n);for(var i=0;i<n;i++)bad[i]=(raw.truth.charCodeAt(i)===49)?1:0;
    return(_cache[name]={name:name,n:n,col:col,bad:bad});}
  var PDM1=[{ds:'along_the_model',f:['bearing_temp_c'],lab:'Along the model',ax:['x = bearing temperature (°C)']},
            {ds:'broken_relation',f:['bearing_temp_c'],lab:'Broken relation',ax:['x = bearing temperature (°C)']}];
  var PDM2=[{ds:'broken_relation',f:['flow_m3h','discharge_pressure_bar'],lab:'Broken relation',ax:['x1 = flow (m3/h)','x2 = discharge pressure (bar)']},
            {ds:'along_the_model',f:['flow_m3h','motor_current_a'],       lab:'Along the model',ax:['x1 = flow (m3/h)','x2 = motor current (A)']}];

  // ---------- estimators ----------
  function fitLogistic(X,ys){var n=X.length,D=X[0].length,i,d,mu=[],sd=[];
    for(d=0;d<D;d++){var m=0,s=0;for(i=0;i<n;i++)m+=X[i][d];m/=n;for(i=0;i<n;i++)s+=(X[i][d]-m)*(X[i][d]-m);mu.push(m);sd.push(Math.sqrt(s/n)||1);}
    var w=[],b=0,lr=0.8,it;for(d=0;d<D;d++)w.push(0);
    for(it=0;it<600;it++){var gw=[],gb=0;for(d=0;d<D;d++)gw.push(0);
      for(i=0;i<n;i++){var z=b;for(d=0;d<D;d++)z+=w[d]*(X[i][d]-mu[d])/sd[d];var e=sig(z)-ys[i];for(d=0;d<D;d++)gw[d]+=e*(X[i][d]-mu[d])/sd[d];gb+=e;}
      for(d=0;d<D;d++)w[d]-=lr*gw[d]/n;b-=lr*gb/n;}
    var W=[],B=b;for(d=0;d<D;d++){W.push(w[d]/sd[d]);B-=w[d]*mu[d]/sd[d];}
    return {post:function(v){var z=B;for(var d=0;d<W.length;d++)z+=W[d]*v[d];return sig(z);},W:W,B:B,linear:true};}
  function fitNB(X,ys){var n=X.length,D=X[0].length,i,d,p=[],q=[];for(i=0;i<n;i++)(ys[i]?p:q).push(X[i]);
    if(!p.length||!q.length)return fitLogistic(X,ys);
    var mp=[],mq=[],v=[];
    for(d=0;d<D;d++){var a=0,b=0,j;for(j=0;j<p.length;j++)a+=p[j][d];a/=p.length;for(j=0;j<q.length;j++)b+=q[j][d];b/=q.length;
      var s=0;for(j=0;j<p.length;j++)s+=(p[j][d]-a)*(p[j][d]-a);for(j=0;j<q.length;j++)s+=(q[j][d]-b)*(q[j][d]-b);
      mp.push(a);mq.push(b);v.push(Math.max(1e-6,s/n));}
    var pi1=p.length/n,W=[],B=Math.log(pi1/(1-pi1));
    for(d=0;d<D;d++){W.push((mp[d]-mq[d])/v[d]);B+=(mq[d]*mq[d]-mp[d]*mp[d])/(2*v[d]);}
    return {post:function(x){var z=B;for(var d=0;d<W.length;d++)z+=W[d]*x[d];return sig(z);},W:W,B:B,linear:true};}
  function fitKNN(X,ys,k,scale){var n=X.length;k=Math.min(k,n);scale=scale||X[0].map(function(){return 1;});
    return {post:function(v){var ds=new Array(n),i,d;for(i=0;i<n;i++){var s=0;for(d=0;d<v.length;d++){var t=(X[i][d]-v[d])/scale[d];s+=t*t;}ds[i]=[s,ys[i]];}
      ds.sort(function(a,b){return a[0]-b[0];});var c=0;for(i=0;i<k;i++)c+=ds[i][1];return c/k;},k:k,linear:false};}
  function gini(p){return 2*p*(1-p);}
  function fitTree(X,ys,depth){var n=X.length,D=X[0].length,i,all=[];for(i=0;i<n;i++)all.push(i);
    function build(idx,d){var m=idx.length,pos=0,j;for(j=0;j<m;j++)pos+=ys[idx[j]];var p=pos/m;
      if(d>=depth||m<4||pos===0||pos===m)return {leaf:true,p:p};
      var best=null,f;
      for(f=0;f<D;f++){var srt=idx.slice().sort(function(a,b){return X[a][f]-X[b][f];}),lp=0;
        for(j=1;j<m;j++){lp+=ys[srt[j-1]];if(X[srt[j]][f]===X[srt[j-1]][f])continue;
          var nl=j,nr=m-j,g=(nl*gini(lp/nl)+nr*gini((pos-lp)/nr))/m;
          if(best===null||g<best.g)best={g:g,f:f,t:(X[srt[j-1]][f]+X[srt[j]][f])/2};}}
      if(!best||best.g>=gini(p)-1e-9)return {leaf:true,p:p};
      var L=[],R=[];for(j=0;j<m;j++)(X[idx[j]][best.f]<best.t?L:R).push(idx[j]);
      return {leaf:false,f:best.f,t:best.t,left:build(L,d+1),right:build(R,d+1)};}
    var root=build(all,0);
    (function prune(nd){if(nd.leaf)return;prune(nd.left);prune(nd.right);
      if(nd.left.leaf&&nd.right.leaf&&((nd.left.p>0.5)===(nd.right.p>0.5))){nd.leaf=true;nd.p=(nd.left.p+nd.right.p)/2;delete nd.left;delete nd.right;}})(root);

    tb.innerHTML=h;}
  // Example table: ข้อมูล 2 คอลัมน์ (Cancer / Healthy) + สถิติ + ความหนาแน่นที่ x0 + Bayes (แบบสไลด์)
  function fillEx(x0){var tb=document.getElementById('exbody');if(!tb)return;var h='',i,n=Math.max(EX.pos.length,EX.neg.length);
    var fp=npdf(x0,EX.sp[0],EX.sp[1]),fn=npdf(x0,EX.sn[0],EX.sn[1]),pip=EX.pip,post=pip*fp/(pip*fp+(1-pip)*fn);
    var stats=lines(['\\bar x_+='+fx(EX.sp[0],1)+',\\ s_+='+fx(EX.sp[1]),'\\bar x_-='+fx(EX.sn[0],1)+',\\ s_-='+fx(EX.sn[1]),
      'f(x\\mid c)=\\dfrac{1}{s_c\\sqrt{2\\pi}}\\,e^{-\\frac{(x-\\bar x_c)^2}{2s_c^2}}',
      'f(x_0{=}'+fx(x0,1)+'\\mid\\text{cancer})='+fx(fp),'f(x_0{=}'+fx(x0,1)+'\\mid\\text{healthy})='+fx(fn),
      'P(\\text{cancer}\\mid x_0)=\\dfrac{\\pi_+ f_+}{\\pi_+ f_+ + \\pi_- f_-}='+fx(post)+'\\ \\ (\\pi_+='+fx(pip)+')']);
    for(i=0;i<n;i++){h+='<tr><td>'+(i<EX.pos.length?kx(fx(EX.pos[i],1)):'')+'</td><td>'+(i<EX.neg.length?kx(fx(EX.neg[i],1)):'')+'</td>'
      +(i===0?'<td class="st" rowspan="'+n+'">'+stats+'</td>':'')+'</tr>';}
    tb.innerHTML=h;}

  // ---------- data for the current tab ----------
  function dataset(){var D=dim(),n=Math.round(gv('n')),X=[],ys=[],k;
    var sym=D===1?['x']:['x_1','x_2'];
    if(!isPDM()){var m0=gv('mu0'),m1=gv('mu1'),my0=gv('muy0'),my1=gv('muy1'),s0=gv('s0'),s1=gv('s1'),p1=gv('p1');
      var n1=Math.max(1,Math.round(n*p1)),n0=Math.max(1,n-n1);
      for(k=0;k<n1;k++){X.push(D===1?[m1+s1*Z1[k]]:[m1+s1*Z1[k],my1+s1*Z1y[k]]);ys.push(1);}
      for(k=0;k<n0;k++){X.push(D===1?[m0+s0*Z0[k]]:[m0+s0*Z0[k],my0+s0*Z0y[k]]);ys.push(0);}
      return {X:X,ys:ys,xmin:-2,xmax:14,ymin:-2,ymax:14,sym:sym,ax:D===1?['x']:['x1','x2'],dec:2,mid:(m0+m1)/2};}
    var c=T().pdm[dsIdx],S=SET(c.ds);if(!S)return {X:[[0],[1]],ys:[0,1],xmin:0,xmax:1,ymin:0,ymax:1,sym:sym,ax:c.ax,dec:2,mid:0.5};
    var sev=gv('sev'),cols=c.f.map(function(f){return S.col[f];}),lo=[],hi=[],mg=[];
    cols.forEach(function(col,d){var s=0,cnt=0;for(var i=0;i<S.n;i++)if(!S.bad[i]){s+=col[i];cnt++;}mg.push(s/(cnt||1));});
    function val(col,d,i){return S.bad[i]?mg[d]+sev*(col[i]-mg[d]):col[i];}
    cols.forEach(function(col,d){var a=Infinity,b=-Infinity;for(var i=0;i<S.n;i++){var v=val(col,d,i);if(v<a)a=v;if(v>b)b=v;}var pad=(b-a)*0.06;lo.push(a-pad);hi.push(b+pad);});
    for(k=0;k<Math.min(n,S.n);k++){var i=PERM[k];X.push(cols.map(function(col,d){return val(col,d,i);}));ys.push(S.bad[i]);}
    return {X:X,ys:ys,xmin:lo[0],xmax:hi[0],ymin:D===2?lo[1]:0,ymax:D===2?hi[1]:1,sym:sym,ax:c.ax,dec:2,mid:(lo[0]+hi[0])/2,scale:cols.map(function(col,d){return (hi[d]-lo[d])||1;})};}

  // ---------- main update ----------
  function upd(){
    if(T().summary)return;
    document.getElementById('modtab').style.display=isEX()?'none':'';document.getElementById('extab').style.display=isEX()?'table':'none';
    if(isEX()){var x0=gv('x0');var DPx={ex:true,dim:1,x0:x0};fillCM(DPx);draw(DPx);fillEx(x0);fillLegend();if(fitPlot()){sizeCanvas();draw(DPx);}return;}
    var D=dim(),S=dataset(),X=S.X,ys=S.ys,kk=Math.round(gv('k')),dp=Math.round(gv('depth')),k;
    var F={logistic:fitLogistic(X,ys),nb:fitNB(X,ys),knn:fitKNN(X,ys,kk,S.scale),tree:fitTree(X,ys,dp)};
    MODELS.forEach(function(m){var f=F[m.key];f.err=trainErr(f.post,X,ys);f.xstar=(D===1&&f.linear)?crossings1(f.post,S.xmin,S.xmax):[];});
    var f1=F[modeM],TP=0,FN=0,FP=0,TN=0,Tmain=S.mid;
    for(k=0;k<X.length;k++){var pr=f1.post(X[k])>0.5;if(ys[k]){if(pr)TP++;else FN++;}else{if(pr)FP++;else TN++;}}
    if(f1.xstar.length){Tmain=f1.xstar[0];for(k=1;k<f1.xstar.length;k++){if(Math.abs(f1.xstar[k]-S.mid)<Math.abs(Tmain-S.mid))Tmain=f1.xstar[k];}}
    var DP={dim:D,xmin:S.xmin,xmax:S.xmax,ymin:S.ymin,ymax:S.ymax,X:X,ys:ys,m:f1,TP:TP,FN:FN,FP:FP,TN:TN,Tmain:Tmain,ax:S.ax};
    fillCM(DP);draw(DP);fillTable(F,S.sym,S.dec);fillLegend();
    if(fitPlot()){sizeCanvas();draw(DP);}
  }
  function fitPlot(){var pn=document.querySelector('.panel'),st=document.querySelector('.stage'),cb=document.querySelector('.canvasbox');
    if(!pn||!st||!cb||innerWidth<=820)return false;
    var cur=cb.getBoundingClientRect().height,others=st.getBoundingClientRect().height-cur;
    var target=Math.max((isPDM()||isEX())?240:200,Math.min(400,Math.round(pn.getBoundingClientRect().height-others)));
    if(Math.abs(target-cur)<2)return false;cb.style.height=target+'px';return true;}

  // ---------- controls ----------
  function setModelSeg(){var bs=document.querySelectorAll('#modelSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(bs[i].getAttribute('data-m')===modeM)?'on':'';
    var sk=(modeM==='knn'),sd=(modeM==='tree');
    document.getElementById('row-k').style.display=sk?'':'none';document.getElementById('row-depth').style.display=sd?'':'none';
    document.getElementById('row-hpblank').style.display=(sk||sd)?'none':'';
    document.getElementById('hd-hp').className='dhd'+((sk||sd)?'':' hid');}
  function setDsSeg(){var bs=document.querySelectorAll('#dsSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(parseInt(bs[i].getAttribute('data-ds'),10)===dsIdx)?'on':'';}
  var nMem={sim:120,pdm:240};
  function syncRows(){var t=T();['ex','pos','neg','ds','share','model'].forEach(function(g){document.getElementById('grp-'+g).style.display=(t.groups.indexOf(g)>=0)?'':'none';});
    ['x0','mu1','muy1','s1','mu0','muy0','s0','p1','sev','n'].forEach(function(b){document.getElementById('row-'+b).style.display=(t.rows.indexOf(b)>=0)?'':'none';});
    var Rn=document.getElementById('Rn'),Nn=document.getElementById('Nn'),pd=isPDM();
    Rn.min=pd?40:20;Rn.max=pd?1440:400;Rn.step=pd?40:10;Nn.min=Rn.min;Nn.max=Rn.max;Nn.step=Rn.step;
    Rn.value=pd?nMem.pdm:nMem.sim;Nn.value=Rn.value;}
  function applyTab(k){curTab=k;var t=TABS[k];dsIdx=0;
    var btns=document.querySelectorAll('.tabbtn');for(var i=0;i<btns.length;i++)btns[i].className='tabbtn'+(i===k?' on':'');
    if(t.summary){document.getElementById('mainPanel').style.display='none';document.getElementById('summaryPanel').className='summary on';renderTexts();return;}
    document.getElementById('mainPanel').style.display='grid';document.getElementById('summaryPanel').className='summary';
    renderTexts();syncRows();setDsSeg();setModelSeg();sizeCanvas();upd();}
  var tb=document.getElementById('tabs');
  TABS.forEach(function(t,i){var el=document.createElement('button');el.className='tabbtn';K('\\text{'+t.n+'}',el);el.addEventListener('click',function(){applyTab(i);});tb.appendChild(el);});
  bases.forEach(function(b){var Re=document.getElementById('R'+b),Ne=document.getElementById('N'+b);
    function rem(){if(b==='n')nMem[isPDM()?'pdm':'sim']=parseFloat(Re.value);}
    Re.addEventListener('input',function(){Ne.value=Re.value;rem();upd();});Ne.addEventListener('input',function(){Re.value=Ne.value;rem();upd();});});
  document.querySelectorAll('#modelSeg button').forEach(function(b){b.addEventListener('click',function(){modeM=b.getAttribute('data-m');setModelSeg();upd();});});
  document.querySelectorAll('#dsSeg button').forEach(function(b){b.addEventListener('click',function(){dsIdx=parseInt(b.getAttribute('data-ds'),10);setDsSeg();upd();});});
  document.getElementById('resample').addEventListener('click',function(){seed=(seed*1664525+1013904223)>>>0;regen(seed);upd();});
  window.addEventListener('resize',function(){sizeCanvas();upd();});

  function boot(){renderTexts();applyTab(0);}
  boot();
  requestAnimationFrame(function(){sizeCanvas();renderTexts();upd();});
  setTimeout(function(){sizeCanvas();renderTexts();if(!T().summary)upd();},250);
  setTimeout(function(){sizeCanvas();renderTexts();if(!T().summary)upd();},800);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(!T().summary){sizeCanvas();upd();}});
})();
</script>
