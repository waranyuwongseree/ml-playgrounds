<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction to Classification</title>
<link rel="stylesheet" href="pg_style.css?v=24">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>
  /* intro-classification — โครง/ฟอนต์ = .distcls กลาง (เหมือน 1-D Bayes); ตาราง = .mtab กลาง 15px */
  .layout{align-items:start}
  .pg.distcls .canvasbox{height:280px}   /* คงที่ทุกโมเดล/ทุกแท็บ (กล่องคำนวณสูงไม่เท่ากัน กราฟต้องไม่เปลี่ยน) */
  .distcls .stage{gap:6px}
  /* bivariate = แบบ 2-D Bayes: plot จตุรัส ซ้าย · confusion matrix ใหญ่ ขวา */
  .toprow{display:flex;gap:26px;align-items:center}
  .toprow .canvasbox{flex:1 1 auto;width:auto;min-width:0;margin:0}
  .toprow.bi .canvasbox{flex:none;aspect-ratio:1/1;width:auto;height:280px}
  .cmwrap{display:none;flex:1 1 auto;min-width:0}
  .toprow.bi .cmwrap{display:block}
  .cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;font-size:15px;width:100%;align-items:center}
  .cm .hh{display:flex;align-items:center;justify-content:center;color:#555;font-size:19px;padding:2px 6px;text-align:center;white-space:nowrap}
  .cm .cell{border-radius:14px;padding:26px 8px;text-align:center}.cm .cell b{font-size:24px;display:block;font-variant-numeric:tabular-nums;font-weight:400}.cm .cell span{font-size:17px}
  .cm .katex{font-size:1em}
  .tp{background:#FBE9E4;color:#8A3B2C}.fn{background:#FAEFD6;color:#8A6510}.fp{background:#E3F1EE;color:#2E7D70}.tn{background:#E9F0F8;color:#3F6E99}
  /* Example (สไลด์ PSA): ซ้าย = ตาราง (สถิติสรุปท้ายตาราง) · ขวา = pdf, posterior, การคำนวณ */
  .exwrap{display:none;gap:18px;align-items:flex-start}
  .exwrap.on{display:flex}
  .exleft{flex:0 0 232px;min-width:0}
  .exright{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
  .excv{height:160px}.excv.post{height:130px}
  .excv canvas{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}
  /* ป้าย KaTeX ทับ canvas (ตัวแปร/ตัวห้อย/ชื่อแกน) — ขนาดเท่าฟอนต์ canvas 13px */
  .canvasbox,.excv{position:relative}
  .cvlab{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;font-size:13px;line-height:1}
  .cvlab>span{position:absolute;white-space:nowrap;color:rgba(90,90,90,0.9)}   /* เฉพาะลูกตรง — ห้ามโดน span ภายในของ KaTeX */
  .cvlab .katex{font-size:1em}
  /* กล่องคำนวณ: แต่ละบรรทัด = ชิ้น KaTeX หลายชิ้น ตัดบรรทัดระหว่างชิ้นได้ (ไม่ตัดกลางสมการ) → ไม่ถูกตัดทิ้ง */
  .excalc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;line-height:1.5;overflow:hidden}
  .excalc .ln{display:block;white-space:normal;margin:2px 0}
  .excalc .ln>span{display:inline-block;margin-right:.3em;vertical-align:middle}
  .excalc .katex{font-size:1em}
  /* บรรทัดมีป้ายกำกับ: ป้าย (เทา กว้างคงที่) | เนื้อสมการ — เส้นคั่นบาง ๆ ระหว่างกลุ่ม (model / rule / testing point) */
  .excalc .ln.lbd{display:flex;align-items:center;gap:10px}
  .excalc .ln.lbd>.lb{flex:0 0 122px;color:var(--muted);font-size:13px;margin:0}
  .excalc .ln.lbd>.bd{flex:1;min-width:0;margin:0}
  .excalc .ln.lbd>.bd>span{display:inline-block;margin-right:.3em;vertical-align:middle;white-space:nowrap}   /* nowrap: KaTeX ยอมตัดบรรทัดที่เครื่องหมาย = ภายในชิ้นเดียวกัน → ผลลัพธ์หลุดไปบรรทัดใหม่ */
  .excalc .ln.lbd>.bd>span.nl{display:block;margin-top:2px}
  .excalc.d2{padding:8px 10px}.excalc.d2 .ln.lbd{gap:6px}.excalc.d2 .ln.lbd>.lb{flex-basis:104px;font-size:12px}.excalc.d2 .ln.lbd>.bd{font-size:11.5px}
  .excalc .ln.lbd:not(.tr)+.ln.lbd,.excalc .ln.tr+.ln.lbd:not(.tr){border-top:1px solid var(--line);padding-top:2px;margin-top:2px}
  .excalc .ln.tr{margin:0;line-height:1.22;font-size:13.5px}   /* กฎของ tree (ลึก 3 = ได้ถึง ~14 บรรทัด) → บรรทัดชิดกัน */
  .dtab{width:100%;border-collapse:collapse;font-size:15px}
  .dtab th{background:var(--navy);color:#fff;font-weight:400;padding:5px 5px;text-align:center}
  .dtab td{padding:1px 6px;text-align:center;color:var(--ink);line-height:1.35;background:#fff}   /* ความสูงแถวเท่ากับ Classification Metrics (20 แถว + หัว ≈ 480px) → จอเตี้ยก็ยังเห็นครบ 20 แถวโดยไม่ต้องเลื่อน */
  .dtab tr.alt td{background:#f1f4f9}
  .dtab tr.ft td{background:#e6ebf4;text-align:left;padding:4px 10px;border-top:2px solid #fff}
  .dtab tr.ft:first-of-type td{border-top:3px solid var(--navy)}
  .dtab .katex{font-size:1em}
  /* LDA → rule (ใต้ control, เฉพาะ Example) */
  .ldabox{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;line-height:1.55}
  .ldabox .lhd{font-size:13px;color:var(--muted);margin-bottom:4px}
  .ldabox .ln{display:block;white-space:nowrap}
  .ldabox .katex{font-size:1em}
  .panel{max-height:calc(100vh - 96px);overflow-y:auto;overflow-x:hidden}
  .seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .seg2 button{flex:1 1 auto;font:inherit;font-size:14px;padding:6px 8px;border:0;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
  .seg2 button.on{background:var(--navy);color:#fff}
  .seg2 .katex{font-size:1em}
  .tgls{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .hid{visibility:hidden}
  .distcls .below{min-height:0;padding:6px 14px 8px}
  .tblbox{min-width:0;width:100%}
  .pg .mtab{margin:0}
  .pg .mtab th,.pg .mtab td{padding:7px 10px;font-size:15px;vertical-align:top;line-height:1.45}
  .pg .mtab th{white-space:normal}
  .pg .mtab th.r{text-align:right}
  .pg .mtab td{font-weight:400;color:var(--ink);font-variant-numeric:normal;text-align:left}
  .pg .mtab td:first-child{white-space:nowrap}
  .pg .mtab td:last-child{text-align:right}
  .pg .mtab th .katex,.pg .mtab td .katex{font-size:1em;line-height:1.2;vertical-align:baseline}
  .pg .mtab th.r .katex,.pg .mtab td:last-child .katex{display:block;text-align:right}
  .pg .mtab th.r .katex-html,.pg .mtab td:last-child .katex-html{display:inline-block}
  .pg .mtab .ln{display:block}
  .pg .mtab .ln .katex{white-space:nowrap}
  .pg .mtab .cw{min-height:2.9em}
  /* model tabs: ตารางข้อมูลซ้าย + คอลัมน์ขวา (แบบ Classifier Evaluation) — ตารางยาวเกินคอลัมน์ขวาให้เลื่อนในตาราง หัวตรึง */
  .stage.mod{flex-direction:row;gap:18px;align-items:flex-start}
  .dleft{display:none;flex:0 0 auto;min-width:0;overflow-y:auto;border-radius:8px;position:relative}   /* relative: ชิ้นส่วน absolute ของ KaTeX ในแถวที่ถูกซ่อนต้องถูก clip ด้วย ไม่งั้นหน้า scroll ยาว */
  .stage.mod .dleft{display:block;flex:0 0 250px}   /* กว้างคงที่ → ตารางและกราฟของ Univariate = PDM univariate (250px เท่า Classification Metrics) */
  .stage.mod.d2 .dleft{flex-basis:300px}            /* bivariate 5 คอลัมน์ → 300px เท่ากันทั้ง Bivariate และ PDM bivariate */
  .main{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-width:0}
  .dtab th{position:sticky;top:0}
  .dtab.c5{font-size:13.5px}.dtab.c5 th{padding:5px 4px}.dtab.c5 td{padding:2px 4px}
  .dtab tr.tp td{background:#FBE9E4}.dtab tr.fn td{background:#FAEFD6}.dtab tr.fp td{background:#E3F1EE}.dtab tr.tn td{background:#E9F0F8}   /* สีแถว = สีช่อง confusion matrix */
  .below .excalc{width:100%;box-sizing:border-box}
  .pg .panel .dgrid{row-gap:5px}   /* Bivariate มี control 11 แถว (+ query point) → บีบช่องว่างให้พอดี 1 หน้า */
  /* summary tab */
  .summary{display:none;flex-direction:column;gap:16px;min-height:0;overflow:visible}
  .summary.on{display:flex;flex:1}
  .secttl{font-size:16px;font-weight:600;color:var(--navy)}
  .found{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .frow{display:flex;align-items:center;gap:16px}
  .frow .fl{flex:0 0 176px;font-size:14px;color:var(--muted);text-align:right}
  .frow .fe{flex:1;font-size:15px;overflow-x:auto;overflow-y:hidden}
  .stab{border-collapse:separate;border-spacing:8px;width:100%}
  .stab th{font-size:13px;color:var(--muted);font-weight:600;padding:4px}
  .stab td{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;vertical-align:top;width:50%}
  .stab td .tag{font-size:13px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:8px;color:#fff}
  .stab td .eq{font-size:15px;margin:6px 0}
  .stab td .note{font-size:13px;color:var(--muted);margin-top:6px}
  .stab td .note>span{display:inline-block;margin-right:.26em}
  .ref{font-size:13px;color:#9ca3af}
  @media(max-width:640px){.frow{flex-direction:column;align-items:flex-start;gap:2px}.frow .fl{text-align:left;flex:none}.exwrap.on{flex-direction:column}.exleft{flex:none}}
</style>
</head>
<body class="pg distcls">
<div class="wrap">
  <div class="hdr"><h1 id="h1">Introduction to Classification</h1><div class="tabs" id="tabs"></div></div>

  <!-- ===== interactive ===== -->
  <div class="layout" id="mainPanel">
    <div class="stage">
      <!-- Example layout -->
      <div class="exwrap" id="exwrap">
        <div class="exleft"><table class="dtab" id="dtab"><thead><tr><th id="dt-x"></th><th id="dt-y"></th></tr></thead><tbody id="dtbody"></tbody></table></div>
        <div class="exright">
          <div class="excv"><canvas id="cvpdf"></canvas></div>
          <div class="excv post"><canvas id="cvpost"></canvas></div>
          <div class="excalc" id="excalc"></div>
        </div>
      </div>
      <!-- model tabs: ตารางข้อมูลซ้าย (x | y | ŷ) · ขวา = กราฟ (+ confusion matrix) → การคำนวณทีละขั้น -->
      <div class="dleft" id="dleft"><table class="dtab" id="mtab"><thead><tr id="mthead"></tr></thead><tbody id="mtbody"></tbody></table></div>
      <div class="main" id="main">
      <div class="toprow" id="toprow">
        <div class="canvasbox"><canvas id="cv"></canvas></div>
        <div class="cmwrap" id="cmwrap"><div class="cm">
          <div class="hh"></div><div class="hh" id="ch-pp"></div><div class="hh" id="ch-pn"></div>
          <div class="hh" id="ch-ap"></div><div class="cell tp"><b id="c-tp">0</b><span id="cs-tp"></span></div><div class="cell fn"><b id="c-fn">0</b><span id="cs-fn"></span></div>
          <div class="hh" id="ch-an"></div><div class="cell fp"><b id="c-fp">0</b><span id="cs-fp"></span></div><div class="cell tn"><b id="c-tn">0</b><span id="cs-tn"></span></div>
        </div></div>
      </div>
      <div class="classleg" id="classleg"></div>
      <div class="below" id="below"><div class="excalc" id="mcalc"></div></div>
      </div>
    </div>

    <!-- CONTROL -->
    <div class="panel">
      <div id="grp-pos"><div class="dhd" id="hd-pos"></div>
      <div class="dgrid">
        <div class="drow" id="row-mu1"><span class="dlab" id="lbl-mu1"></span><input type="range" id="Rmu1" min="1" max="9" step="0.1" value="6.0"><input class="num" type="number" id="Nmu1" min="1" max="9" step="0.1" value="6.0"></div>
        <div class="drow" id="row-muy1"><span class="dlab" id="lbl-muy1"></span><input type="range" id="Rmuy1" min="1" max="9" step="0.1" value="6.0"><input class="num" type="number" id="Nmuy1" min="1" max="9" step="0.1" value="6.0"></div>
        <div class="drow" id="row-s1"><span class="dlab" id="lbl-s1"></span><input type="range" id="Rs1" min="0.4" max="2.5" step="0.1" value="1.0"><input class="num" type="number" id="Ns1" min="0.4" max="2.5" step="0.1" value="1.0"></div>
      </div></div>
      <div id="grp-neg"><div class="dhd" id="hd-neg"></div>
      <div class="dgrid">
        <div class="drow" id="row-mu0"><span class="dlab" id="lbl-mu0"></span><input type="range" id="Rmu0" min="1" max="9" step="0.1" value="3.0"><input class="num" type="number" id="Nmu0" min="1" max="9" step="0.1" value="3.0"></div>
        <div class="drow" id="row-muy0"><span class="dlab" id="lbl-muy0"></span><input type="range" id="Rmuy0" min="1" max="9" step="0.1" value="3.0"><input class="num" type="number" id="Nmuy0" min="1" max="9" step="0.1" value="3.0"></div>
        <div class="drow" id="row-s0"><span class="dlab" id="lbl-s0"></span><input type="range" id="Rs0" min="0.4" max="2.5" step="0.1" value="1.0"><input class="num" type="number" id="Ns0" min="0.4" max="2.5" step="0.1" value="1.0"></div>
      </div></div>
      <div id="grp-ds"><div class="dhd" id="hd-ds"></div>
      <div class="seg2" id="dsSeg"><button data-ds="0" id="ds-0" class="on"></button><button data-ds="1" id="ds-1"></button></div></div>
      <div id="grp-share"><div class="dhd" id="hd-share"></div>
      <div class="dgrid">
        <div class="drow" id="row-sep"><span class="dlab" id="lbl-sep"></span><input type="range" id="Rsep" min="0" max="6" step="0.1" value="3.0"><input class="num" type="number" id="Nsep" min="0" max="6" step="0.1" value="3.0"></div>
        <div class="drow" id="row-sg"><span class="dlab" id="lbl-sg"></span><input type="range" id="Rsg" min="0.4" max="2.5" step="0.1" value="1.0"><input class="num" type="number" id="Nsg" min="0.4" max="2.5" step="0.1" value="1.0"></div>
        <div class="drow" id="row-p1"><span class="dlab" id="lbl-p1"></span><input type="range" id="Rp1" min="0.05" max="0.95" step="0.01" value="0.50"><input class="num" type="number" id="Np1" min="0.05" max="0.95" step="0.01" value="0.50"></div>
        <div class="drow" id="row-sev"><span class="dlab" id="lbl-sev"></span><input type="range" id="Rsev" min="0" max="2" step="0.1" value="1.0"><input class="num" type="number" id="Nsev" min="0" max="2" step="0.1" value="1.0"></div>
        <div class="drow" id="row-n"><span class="dlab" id="lbl-n"></span><input type="range" id="Rn" min="20" max="400" step="10" value="120"><input class="num" type="number" id="Nn" min="20" max="400" step="10" value="120"></div>
      </div></div>
      <div id="grp-model">
      <div class="dhd" id="hd-model"></div>
      <div class="seg2" id="modelSeg">
        <button data-m="knn" id="sb-knn" class="on"></button><button data-m="tree" id="sb-tree"></button><button data-m="nb" id="sb-nb"></button><button data-m="logistic" id="sb-logistic"></button>
      </div>
      <div class="dhd" id="hd-hp"></div>
      <div class="dgrid" id="grid-hp">
        <div class="drow" id="row-k"><span class="dlab" id="lbl-k"></span><input type="range" id="Rk" min="1" max="31" step="2" value="1"><input class="num" type="number" id="Nk" min="1" max="31" step="2" value="1"></div>
        <div class="drow" id="row-depth"><span class="dlab" id="lbl-depth"></span><input type="range" id="Rdepth" min="1" max="3" step="1" value="1"><input class="num" type="number" id="Ndepth" min="1" max="3" step="1" value="1"></div>
        <div class="drow hid" id="row-hpblank"><span class="dlab">&nbsp;</span><input type="range" disabled><input class="num" type="number" disabled></div>
      </div>
      </div>
      <!-- Testing point: ใต้ Model (ตั้งข้อมูล → เลือกแบบจำลอง → ทดสอบจุดใหม่) · Resample อยู่ล่างสุด -->
      <div id="grp-ex"><div class="dhd" id="hd-ex"></div>
      <div class="dgrid">
        <div class="drow" id="row-x0"><span class="dlab" id="lbl-x0"></span><input type="range" id="Rx0" min="0" max="12" step="0.1" value="4.5"><input class="num" type="number" id="Nx0" min="0" max="12" step="0.1" value="4.5"></div>
        <div class="drow" id="row-xy0"><span class="dlab" id="lbl-xy0"></span><input type="range" id="Rxy0" min="0" max="12" step="0.1" value="4.5"><input class="num" type="number" id="Nxy0" min="0" max="12" step="0.1" value="4.5"></div>
      </div></div>
      <div id="grp-rs" class="tgls"><button class="primary" id="resample" style="width:100%"></button></div>
    </div>
  </div>

  <div class="summary" id="summaryPanel"></div>
</div>

<script>
(function(){
  "use strict";
  // ---------- rng ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var MAXN=400, Z0=[],Z1=[],Z0y=[],Z1y=[],PERM=[];
  function regen(seed){var rng=mulberry32(seed),i;function g(){var u=rng()||1e-9,v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
    Z0=[];Z1=[];Z0y=[];Z1y=[];for(i=0;i<MAXN;i++){Z0.push(g());Z1.push(g());Z0y.push(g());Z1y.push(g());}
    PERM=[];for(i=0;i<1440;i++)PERM.push(i);for(i=1439;i>0;i--){var j=Math.floor(rng()*(i+1)),t=PERM[i];PERM[i]=PERM[j];PERM[j]=t;}}
  var seed=12345; regen(seed);
  function sig(z){return 1/(1+Math.exp(-z));}
  var SQ2PI=Math.sqrt(2*Math.PI);
  function npdf(x,m,s){return Math.exp(-0.5*((x-m)/s)*((x-m)/s))/(s*SQ2PI);}

  // ---------- Example (สไลด์ PSA) — เริ่มด้วยข้อมูลสไลด์ 14 ค่า; แตะ μ/σ/n หรือ Resample → สุ่มจาก normal ----------
  var SLIDE={pos:[4.1,3.4,2.9,2.8,2.7,2.1,1.6],neg:[2.5,2.0,1.7,1.4,1.2,0.9,0.8]};
  var EX={xmin:0,xmax:5,ax:'x=\\text{PSA }(\\mu\\text{g/L})',fixed:true,pos:SLIDE.pos.slice(),neg:SLIDE.neg.slice()};
  function msd(a){var m=0,s=0,i;for(i=0;i<a.length;i++)m+=a[i];m/=a.length;for(i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return [m,Math.sqrt(s/Math.max(1,a.length-1))];}
  function exBuild(){ // ข้อมูล → สถิติ → pdf ต่อคลาส → posterior (per-class s แบบสไลด์) → LDA (s รวม) → threshold
    if(!EX.fixed){var m1=gv('mu1'),m0=gv('mu0'),s=gv('s1'),n=7,k;   // n fix = 7 ต่อคลาส · σ ร่วม
      // แพตเทิร์นเบี่ยงเบนชุดเดียว d_i ใช้กับทั้งสองคลาส: มาตรฐาน z → ×σ → ปัดกริด 0.1 → บังคับ Σd = 0
      // ⇒ x̄ = μ พอดี และ s+ = s− เท่ากันเป๊ะเมื่อคำนวณจากค่าที่โชว์ในตาราง

  }
  function fitPlot(){return false;   // ความสูงกราฟคงที่ 280px (CSS) — ไม่ปรับตามแผงควบคุมแล้ว
    var pn=document.querySelector('.panel'),st=document.querySelector('.stage'),cb=document.querySelector('.canvasbox');
    if(!pn||!st||!cb||innerWidth<=820||isEX())return false;
    var cur=cb.getBoundingClientRect().height,others=st.getBoundingClientRect().height-cur;
    var target=Math.max(isPDM()?240:200,Math.min(400,Math.round(pn.getBoundingClientRect().height-others)));
    if(Math.abs(target-cur)<2)return false;cb.style.height=target+'px';return true;}

  // ---------- controls ----------
  function setModelSeg(){var bs=document.querySelectorAll('#modelSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(bs[i].getAttribute('data-m')===modeM)?'on':'';
    var sk=(modeM==='knn'),sd=(modeM==='tree');
    document.getElementById('row-k').style.display=sk?'':'none';document.getElementById('row-depth').style.display=sd?'':'none';
    // logistic / naive Bayes ไม่มี hyperparameter → ซ่อนหัว "Model setting" และแถวว่างจริง ๆ (เดิมจองที่ไว้ ทำให้เกิดช่องว่างใหญ่ก่อน control ถัดไป)
    document.getElementById('row-hpblank').style.display='none';
    document.getElementById('hd-hp').style.display=(sk||sd)?'':'none';}
  function setDsSeg(){var bs=document.querySelectorAll('#dsSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(parseInt(bs[i].getAttribute('data-ds'),10)===dsIdx)?'on':'';}
  // ค่า control จำแยกตามชนิด tab: sim (Univariate/Bivariate) · ex (Example, สเกล PSA) · pdm
  var MEM={sim:{mu1:70.8,s1:1.0,mu0:68.5,s0:1.0,sep:3.0,sg:1.0,n:20},   /* μ บนสเกลอุณหภูมิแบริ่ง (°C): healthy ≈ 68.5 · fault ≈ 70.8 (ค่าจากข้อมูลปั๊มจริง) */ex:{x0:2.6,mu1:2.8,s1:0.82,mu0:1.5,s0:0.61,n:7},pdm:{n:20}};   // sim n=20 เท่ากับ Classifier Evaluation · pdm x0/xy0 ตั้งจากช่วงข้อมูลตอน upd
  function kind(){return isEX()?'ex':isPDM()?'pdm':'sim';}
  var RANGE={sim:{mu:[65,75,0.1],s:[0.4,2.5,0.1],n:[12,60,4]},ex:{mu:[0.5,4.5,0.1],s:[0.2,1.5,0.01],n:[3,12,1],x0:[0.3,4.7,0.1]},pdm:{n:[20,1440,20]}};   /* ทุกแท็บเริ่มที่ n = 20 (ตารางเห็นครบไม่ต้องเลื่อน) */
  function setRange(b,r){['R','N'].forEach(function(p){var e=document.getElementById(p+b);e.min=r[0];e.max=r[1];e.step=r[2];});}
  function syncRows(){var t=T(),kd=kind();['ex','pos','neg','ds','share','model','rs'].forEach(function(g){document.getElementById('grp-'+g).style.display=(t.groups.indexOf(g)>=0)?'':'none';});
    ['x0','xy0','mu1','muy1','s1','mu0','muy0','s0','sep','sg','p1','sev','n'].forEach(function(b){document.getElementById('row-'+b).style.display=(t.rows.indexOf(b)>=0)?'':'none';});
    var R=RANGE[kd];if(R.mu){setRange('mu1',R.mu);setRange('mu0',R.mu);setRange('s1',R.s);setRange('s0',R.s);}setRange('n',R.n);if(R.x0){setRange('x0',R.x0);setRange('xy0',R.x0);}
    var M=MEM[kd];for(var b in M){if(b.indexOf('@')<0)sv(b,M[b]);}}   // ข้าม key ของ query point PDM (x0@ชุด)
  // PDM: ช่วง x0/xy0 = ช่วงข้อมูลของชุดที่เลือก (ค่าเริ่ม = กึ่งกลาง) · จำค่าต่อชุด/แกน
  // ช่วง testing point = ช่วงแกนของกราฟ (ตามข้อมูล) → จุดไม่หลุดนอกกราฟ · step ตามสเกลของแกน (flow 0.1 · pressure 0.01) · จำค่าต่อแท็บ/แกน แล้วหนีบเข้าช่วง
  var QM={};
  function syncQueryPDM(S){var ds=T().n+dsIdx;
    [['x0',S.xmin,S.xmax],['xy0',S.ymin,S.ymax]].forEach(function(q){if(q[0]==='xy0'&&dim()!==2)return;var lo=q[1],hi=q[2],st=Math.pow(10,Math.floor(Math.log10((hi-lo)/100)));
      var r=function(v){return +(v.toFixed(4));};   // ตัดเศษ floating (64.32000000000001)
      var a=r(Math.ceil(lo/st)*st),b=r(Math.floor(hi/st)*st);setRange(q[0],[a,b,st]);var key=q[0]+'@'+ds;if(QM[key]===undefined)QM[key]=r(Math.round((lo+hi)/2/st)*st);
      QM[key]=Math.min(b,Math.max(a,QM[key]));sv(q[0],QM[key]);});}
  function applyTab(k){curTab=k;var t=TABS[k];dsIdx=0;
    var btns=document.querySelectorAll('.tabbtn');for(var i=0;i<btns.length;i++)btns[i].className='tabbtn'+(i===k?' on':'');
    if(t.summary){document.getElementById('mainPanel').style.display='none';document.getElementById('summaryPanel').className='summary on';renderTexts();return;}
    document.getElementById('mainPanel').style.display='grid';document.getElementById('summaryPanel').className='summary';
    renderTexts();syncRows();setDsSeg();setModelSeg();sizeCanvas();upd();}
  var tb=document.getElementById('tabs');
  TABS.forEach(function(t,i){var el=document.createElement('button');el.className='tabbtn';K('\\text{'+t.n+'}',el);el.addEventListener('click',function(){applyTab(i);});tb.appendChild(el);});
  bases.forEach(function(b){var Re=document.getElementById('R'+b),Ne=document.getElementById('N'+b);
    function rem(){var M=MEM[kind()];if(M&&(b in M))M[b]=parseFloat(Re.value);
      if(b==='x0'||b==='xy0')QT[T().n+dsIdx]=true;   // ผู้ใช้เลื่อน testing point เอง → เลิกตาม threshold
      if(b==='x0'||b==='xy0')QM[b+'@'+T().n+dsIdx]=parseFloat(Re.value);   // query point ของ PDM จำต่อชุดข้อมูล
      if(isEX()&&(b==='s1'||b==='s0')){var v=parseFloat(Re.value);sv(b==='s1'?'s0':'s1',v);MEM.ex.s1=v;MEM.ex.s0=v;}   // Example: σ ร่วม (σ+ = σ−) ปรับจากตัวไหนก็ได้
      if(isEX()&&(b==='mu1'||b==='s1'||b==='mu0'||b==='s0'||b==='n'))EX.fixed=false;}   // แตะ μ/σ ใน Example → สุ่มข้อมูลใหม่
    Re.addEventListener('input',function(){Ne.value=Re.value;rem();upd();});Ne.addEventListener('input',function(){Re.value=Ne.value;rem();upd();});});
  document.querySelectorAll('#modelSeg button').forEach(function(b){b.addEventListener('click',function(){modeM=b.getAttribute('data-m');setModelSeg();upd();});});
  document.querySelectorAll('#dsSeg button').forEach(function(b){b.addEventListener('click',function(){dsIdx=parseInt(b.getAttribute('data-ds'),10);setDsSeg();upd();});});
  document.getElementById('resample').addEventListener('click',function(){seed=(seed*1664525+1013904223)>>>0;regen(seed);if(isEX())EX.fixed=false;upd();});
  window.addEventListener('resize',function(){sizeCanvas();upd();});

  function boot(){renderTexts();applyTab(0);}
  boot();
  requestAnimationFrame(function(){sizeCanvas();renderTexts();upd();});
  setTimeout(function(){sizeCanvas();renderTexts();if(!T().summary)upd();},250);
  setTimeout(function(){sizeCanvas();renderTexts();if(!T().summary)upd();},800);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(!T().summary){sizeCanvas();upd();}});
})();
</script>
