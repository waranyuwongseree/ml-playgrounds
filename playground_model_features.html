<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model & Feature Comparison</title>
<link rel="stylesheet" href="pg_style.css?v=24">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>
  /* Model & Feature Comparison — แม่แบบ = Introduction to Classification (แท็บ Bivariate):
     ซ้าย = ตารางข้อมูล · กลาง = scatter + legend + กล่องคำนวณ · ขวา = control (ข้อมูล → แบบจำลอง → feature)
     2 แท็บ: Raw Features (เทียบแบบจำลอง) · Feature Engineering (เทียบชุด feature) */
  .layout{align-items:start}
  html{scrollbar-gutter:stable}
  .distcls .stage{gap:6px}
  .stage.mod{flex-direction:row;gap:18px;align-items:flex-start}
  .dleft{flex:0 0 330px;min-width:0;overflow-y:auto;border-radius:8px;position:relative}   /* กว้างคงที่ทั้งสองแท็บ (แท็บ 2 มีคอลัมน์ feature เพิ่ม) · relative: clip ชิ้นส่วน absolute ของ KaTeX */
  .main{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-width:0}
  .pg.distcls .canvasbox{height:clamp(230px,calc(100vh - 410px),300px);position:relative;margin:0}   /* จอสูง 650 → 252px: เหลือที่ให้กฎของ tree ลึก 3 (ยาวสุด) โดยหน้าไม่ scroll */
  .cvlab{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;font-size:13px;line-height:1}
  .cvlab>span{position:absolute;white-space:nowrap;color:rgba(90,90,90,0.9)}
  .cvlab .katex{font-size:1em}
  .dtab{width:100%;border-collapse:collapse;font-size:13.5px}
  .dtab th{background:var(--navy);color:#fff;font-weight:400;padding:5px 4px;text-align:center;position:sticky;top:0}
  .dtab td{padding:1px 4px;text-align:center;color:var(--ink);line-height:1.5;background:#fff}
  .dtab td.fe{color:#2C6B52}   /* คอลัมน์ที่สร้างเพิ่ม (engineered) */
  .dtab tr.tp td{background:#FBE9E4}.dtab tr.fn td{background:#FAEFD6}.dtab tr.fp td{background:#E3F1EE}.dtab tr.tn td{background:#E9F0F8}   /* สีแถว = ผลทำนาย */
  .dtab .katex{font-size:1em}
  /* กล่องคำนวณ: ป้าย (เทา กว้างคงที่) | เนื้อหา — แบบเดียวกับ Intro */
  .excalc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.5;overflow:hidden}
  .excalc .ln{display:flex;align-items:center;gap:8px;margin:2px 0}
  .excalc .ln>.lb{flex:0 0 112px;color:var(--muted);font-size:13px}
  .excalc .ln>.bd{flex:1;min-width:0}
  .excalc .ln>.bd>span{display:inline-block;margin-right:.35em;vertical-align:middle;white-space:nowrap}
  .excalc .ln:not(.tr)+.ln,.excalc .ln.tr+.ln:not(.tr){border-top:1px solid var(--line);padding-top:2px;margin-top:2px}
  .excalc .ln.tr{margin:0;line-height:1.12;font-size:13px}   /* บรรทัดต่อเนื่อง (กฎของ tree ลึก 3 = ได้ถึง ~14 บรรทัด · z(x) ของ logistic) → ชิดกัน */
  .excalc .katex{font-size:1em}
  .excalc.sm .ln.tr{font-size:11.5px;line-height:1.0}
  .seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .seg2 button{flex:1 1 auto;font:inherit;font-size:14px;padding:6px 8px;border:0;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
  .seg2 button.on{background:var(--navy);color:#fff}
  .seg2 .katex{font-size:1em}
  .seg2.two button{flex:1 1 50%}
  .tgls{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .pg .panel .dgrid{row-gap:5px}
  @media(max-width:820px){.stage.mod{flex-direction:column}.dleft{flex:none;width:100%}.pg .layout>.panel{position:static}}
</style>
</head>
<body class="pg distcls">
<div class="wrap">
  <div class="hdr"><h1 id="h1">Model &amp; Feature Comparison</h1><div class="tabs" id="tabs"></div></div>

  <div class="layout" id="mainPanel">
    <div class="stage mod">
      <div class="dleft" id="dleft"><table class="dtab" id="mtab"><thead><tr id="mthead"></tr></thead><tbody id="mtbody"></tbody></table></div>
      <div class="main" id="main">
        <div class="canvasbox"><canvas id="cv"></canvas></div>
        <div class="classleg" id="classleg"></div>
        <div class="excalc" id="mcalc"></div>
      </div>
    </div>

    <!-- CONTROL: ข้อมูล → แบบจำลอง → (แท็บ 2) feature -->
    <div class="panel">
      <div id="grp-pat"><div class="dhd" id="hd-pat"></div>
      <div class="seg2 two" id="patSeg"><button data-v="line" id="pt-line" class="on"></button><button data-v="box" id="pt-box"></button><button data-v="circle" id="pt-circle"></button><button data-v="disagree" id="pt-disagree"></button></div>
      <div class="dgrid">
        <div class="drow" id="row-n"><span class="dlab" id="lbl-n"></span><input type="range" id="Rn" min="20" max="200" step="20" value="40"><input class="num" type="number" id="Nn" min="20" max="200" step="20" value="40"></div>
        <div class="drow" id="row-noise"><span class="dlab" id="lbl-noise"></span><input type="range" id="Rnoise" min="0" max="0.2" step="0.01" value="0.05"><input class="num" type="number" id="Nnoise" min="0" max="0.2" step="0.01" value="0.05"></div>
      </div></div>
      <div id="grp-model"><div class="dhd" id="hd-model"></div>
      <div class="seg2" id="modelSeg"><button data-v="knn" id="sb-knn" class="on"></button><button data-v="tree" id="sb-tree"></button><button data-v="nb" id="sb-nb"></button><button data-v="logistic" id="sb-logistic"></button></div>
      <div class="dhd" id="hd-hp"></div>
      <div class="dgrid">
        <div class="drow" id="row-k"><span class="dlab" id="lbl-k"></span><input type="range" id="Rk" min="1" max="39" step="2" value="5"><input class="num" type="number" id="Nk" min="1" max="39" step="2" value="5"></div>
        <div class="drow" id="row-depth"><span class="dlab" id="lbl-depth"></span><input type="range" id="Rdepth" min="1" max="3" step="1" value="3"><input class="num" type="number" id="Ndepth" min="1" max="3" step="1" value="3"></div>
      </div></div>
      <div id="grp-feat"><div class="dhd" id="hd-feat"></div>
      <div class="seg2" id="featSeg"><button data-v="raw" id="ft-raw" class="on"></button><button data-v="sq" id="ft-sq"></button><button data-v="int" id="ft-int"></button></div></div>
      <div id="grp-rs" class="tgls"><button class="primary" id="resample" style="width:100%"></button></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  /* ==========================================================================================
     MODEL & FEATURE COMPARISON — รวม "Model comparison" กับ "Feature engineering" (แม่แบบ = Intro)
       แท็บ Raw Features        : feature = x₁, x₂ เท่านั้น · เปลี่ยนแบบจำลอง → บรรทัด Test accuracy เทียบ 4 แบบจำลอง
       แท็บ Feature Engineering : เพิ่มคอลัมน์ x₁², x₂² หรือ x₁x₂ (เห็นเป็นคอลัมน์ในตาราง) → เทียบ 3 ชุด feature ของแบบจำลองที่เลือก
     ข้อมูล 4 รูปแบบ ตั้งให้ผู้ชนะไม่ซ้ำกัน: Line เส้นตรง · Box กล่อง (tree) · Circle วงกลม (ต้องการ x²) · Disagree สองมุมตรงข้าม (ต้องการ x₁x₂)
     Test accuracy วัดบนจุดใหม่ NTEST จุดจากเครื่องกำเนิดเดียวกัน (ไม่แสดงในกราฟ) — กราฟ/ตาราง/ป้ายนับ = ข้อมูลฝึก n จุด
     ========================================================================================== */
  var LO=0,HI=10,NTEST=800;
  var TABS=[{n:'\\text{Raw Features}',fe:false},{n:'\\text{Feature Engineering}',fe:true}];
  var MODELS=[{k:'knn',n:'k\\text{-NN}'},{k:'tree',n:'\\text{Tree}'},{k:'nb',n:'\\text{Naive Bayes}',s:'\\text{NB}'},{k:'logistic',n:'\\text{Logistic}'}];
  var FEATS=[{k:'raw',n:'\\text{Raw}',names:['x_1','x_2']},{k:'sq',n:'+\\,x_1^2,\\ x_2^2',s:'+\\,x^2',names:['x_1','x_2','x_1^2','x_2^2']},{k:'int',n:'+\\,x_1x_2',names:['x_1','x_2','x_1x_2']}];
  var PATS={line:'\\text{Line}',box:'\\text{Box}',circle:'\\text{Circle}',disagree:'\\text{Disagree}'};
  var MC='#1e3a8a',Rd='#B0503A',Bl='#3F6E99';
  var curTab=0,pat='line',model='knn',feat='raw',seed=20260917;
  function FK(){return TABS[curTab].fe?feat:'raw';}   // แท็บ Raw Features ใช้ feature ดิบเสมอ
  function FT(k){return FEATS.filter(function(f){return f.k===k;})[0];}

  // ---------- rng + cached draws ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var MAXN=200,U=[],TU=[];
  function regen(s){var r=mulberry32(s),i;U=[];TU=[];for(i=0;i<MAXN;i++)U.push([r(),r(),r()]);for(i=0;i<NTEST;i++)TU.push([r(),r(),r()]);}
  regen(seed);
  function gv(b){return parseFloat(document.getElementById('R'+b).value);}
  function sv(b,v){document.getElementById('R'+b).value=v;document.getElementById('N'+b).value=v;}

  // ---------- data ----------
  function isPos(p,a,b){if(p==='line')return a+b>11;if(p==='box')return !(a>=2.5&&a<=7.5&&b>=2.5&&b<=7.5);
    if(p==='circle')return Math.sqrt((a-5)*(a-5)+(b-5)*(b-5))>3.4;return Math.abs(a-b)>4;}
  function gen(src,n,noise){var X=[],y=[],i;for(i=0;i<n;i++){var a=Math.round((LO+(HI-LO)*src[i][0])*10)/10,b=Math.round((LO+(HI-LO)*src[i][1])*10)/10,l=isPos(pat,a,b)?1:0;if(src[i][2]<noise)l=1-l;X.push([a,b]);y.push(l);}return {X:X,y:y};}
  function phi(x,fk){return fk==='raw'?[x[0],x[1]]:fk==='sq'?[x[0],x[1],x[0]*x[0],x[1]*x[1]]:[x[0],x[1],x[0]*x[1]];}   // คอลัมน์ใหม่คำนวณจากค่าดิบ (ตรงกับที่เห็นในตาราง)

  // ---------- models: fit(F, y) → {post(f)} · F = แถวของ feature ----------
  function colStats(F){var D=F[0].length,mu=[],sd=[],d,i;for(d=0;d<D;d++){var m=0,q=0;for(i=0;i<F.length;i++)m+=F[i][d];m/=F.length;for(i=0;i<F.length;i++)q+=(F[i][d]-m)*(F[i][d]-m);mu.push(m);sd.push(Math.sqrt(q/Math.max(1,F.length-1))||1);}return {mu:mu,sd:sd};}
  function zrow(f,S){return f.map(function(v,d){return (v-S.mu[d])/S.sd[d];});}
  function fitKNN(F,y,k){var S=colStats(F),Z=F.map(function(f){return zrow(f,S);}),n=Z.length;k=Math.min(k,n);   // ระยะวัดบนคอลัมน์ที่ standardise แล้ว
    return {k:k,post:function(f){var z=zrow(f,S),bd=[],bl=[],i,d,j;for(i=0;i<n;i++){var s=0;for(d=0;d<z.length;d++){var t=Z[i][d]-z[d];s+=t*t;}
        if(bd.length<k||s<bd[bd.length-1]){j=bd.length;if(j===k)j=k-1;else{bd.push(0);bl.push(0);}while(j>0&&bd[j-1]>s){bd[j]=bd[j-1];bl[j]=bl[j-1];j--;}bd[j]=s;bl[j]=y[i];}}
      var c=0;for(i=0;i<bl.length;i++)c+=bl[i];return c/bl.length;}};}
  function gini(p){return 2*p*(1-p);}
  function fitTree(F,y,depth){var D=F[0].length,all=[],i;for(i=0;i<F.length;i++)all.push(i);
    function bld(idx,dep){var m=idx.length,pos=0,j;for(j=0;j<m;j++)pos+=y[idx[j]];var p=pos/m;if(dep>=depth||m<4||pos===0||pos===m)return {leaf:true,p:p};
      var best=null;for(var f=0;f<D;f++){var srt=idx.slice().sort(function(u,v){return F[u][f]-F[v][f];}),lp=0;
        for(j=1;j<m;j++){lp+=y[srt[j-1]];if(F[srt[j]][f]===F[srt[j-1]][f])continue;var g=(j*gini(lp/j)+(m-j)*gini((pos-lp)/(m-j)))/m;if(best===null||g<best.g)best={g:g,f:f,t:(F[srt[j-1]][f]+F[srt[j]][f])/2};}}
      if(!best||best.g>=gini(p)-1e-9)return {leaf:true,p:p};var L=[],R=[];for(j=0;j<m;j++)(F[idx[j]][best.f]<best.t?L:R).push(idx[j]);
      return {leaf:false,f:best.f,t:best.t,left:bld(L,dep+1),right:bld(R,dep+1)};}
    var root=bld(all,0);
    (function prune(nd){if(nd.leaf)return;prune(nd.left);prune(nd.right);if(nd.left.leaf&&nd.right.leaf&&((nd.left.p>0.5)===(nd.right.p>0.5))){nd.leaf=true;nd.p=(nd.left.p+nd.right.p)/2;delete nd.left;delete nd.right;}})(root);
    return {root:root,post:function(f){var nd=root;while(!nd.leaf)nd=f[nd.f]<nd.t?nd.left:nd.right;return nd.p;}};}
  function fitNB(F,y){var D=F[0].length,st=[[],[]],cnt=[0,0],c,d,i;
    for(c=0;c<2;c++)for(d=0;d<D;d++){var m=0,q=0,k=0;for(i=0;i<F.length;i++)if(y[i]===c){m+=F[i][d];k++;}m/=Math.max(1,k);for(i=0;i<F.length;i++)if(y[i]===c)q+=(F[i][d]-m)*(F[i][d]-m);st[c].push([m,Math.max(1e-3,q/Math.max(1,k))]);cnt[c]=k;}
    var lp=[Math.log(Math.max(1e-9,cnt[0]/F.length)),Math.log(Math.max(1e-9,cnt[1]/F.length))];
    return {post:function(f){var s=[lp[0],lp[1]];for(c=0;c<2;c++)for(d=0;d<D;d++){var v=st[c][d][1],t=f[d]-st[c][d][0];s[c]+=-0.5*Math.log(v)-t*t/(2*v);}return 1/(1+Math.exp(s[0]-s[1]));}};}
  function solve(A,b){var n=b.length,i,j,k;for(i=0;i<n;i++){var p=i;for(k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[p][i]))p=k;var t=A[i];A[i]=A[p];A[p]=t;var tb=b[i];b[i]=b[p];b[p]=tb;
      if(Math.abs(A[i][i])<1e-12)continue;for(k=i+1;k<n;k++){var f=A[k][i]/A[i][i];for(j=i;j<n;j++)A[k][j]-=f*A[i][j];b[k]-=f*b[i];}}
    var x=new Array(n);for(i=n-1;i>=0;i--){var s=b[i];for(j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=Math.abs(A[i][i])<1e-12?0:s/A[i][i];}return x;}
  function fitLogistic(F,y){var S=colStats(F),Z=F.map(function(f){return zrow(f,S);}),D=Z[0].length+1,w=[],i,d,e,it;for(d=0;d<D;d++)w.push(0);   // IRLS บนคอลัมน์ standardise + ridge เล็กน้อย → แปลงสัมประสิทธิ์กลับเป็นหน่วยดิบเพื่อแสดงสมการ
    for(it=0;it<25;it++){var H=[],g=[];for(d=0;d<D;d++){g.push(0);H.push(new Array(D).fill(0));}
      for(i=0;i<Z.length;i++){var x=[1].concat(Z[i]),z=0;for(d=0;d<D;d++)z+=w[d]*x[d];var p=1/(1+Math.exp(-z)),r=Math.max(1e-6,p*(1-p));for(d=0;d<D;d++){g[d]+=(y[i]-p)*x[d];for(e=0;e<D;e++)H[d][e]+=r*x[d]*x[e];}}
      for(d=0;d<D;d++){H[d][d]+=0.05;g[d]-=0.05*w[d];}var stp=solve(H,g),mx=0;for(d=0;d<D;d++){w[d]+=stp[d];mx=Math.max(mx,Math.abs(stp[d]));}if(mx<1e-6)break;}
    var C=[w[0]];for(d=1;d<D;d++){C.push(w[d]/S.sd[d-1]);C[0]-=w[d]*S.mu[d-1]/S.sd[d-1];}
    return {C:C,post:function(f){var z=C[0];for(var d2=0;d2<f.length;d2++)z+=C[d2+1]*f[d2];return 1/(1+Math.exp(-z));}};}
  function fit(mk,fk,TR){var F=TR.X.map(function(x){return phi(x,fk);});
    return mk==='knn'?fitKNN(F,TR.y,Math.round(gv('k'))):mk==='tree'?fitTree(F,TR.y,Math.round(gv('depth'))):mk==='nb'?fitNB(F,TR.y):fitLogistic(F,TR.y);}
  function acc(m,fk,S){var ok=0,i;for(i=0;i<S.X.length;i++)if(((m.post(phi(S.X[i],fk))>0.5)?1:0)===S.y[i])ok++;return S.X.length?ok/S.X.length:0;}

  // ---------- KaTeX helpers ----------
  var KXC={};   // cache: ตาราง 200 แถวเรนเดอร์ตัวเลข/เครื่องหมายซ้ำ ๆ นับพันครั้ง
  function kx(t){if(KXC[t]!==undefined)return KXC[t];var r;try{r=katex.renderToString(t,{throwOnError:false});}catch(e){r=t;}if(t.length<24)KXC[t]=r;return r;}
  function K(t,el){if(!el)return;try{katex.render(t,el,{throwOnError:false});}catch(e){el.textContent=t;}}
  function POS(){return 'y=\\textcolor{'+Rd+'}{\\text{positive}}';} function NEG(){return 'y=\\textcolor{'+Bl+'}{\\text{negative}}';}
  function num(v){var a=Math.abs(v);return (a<1e-9?0:a).toFixed(a>=0.095||a<1e-9?2:3);}
  function sgn(v){return (v>=0?'+':'-')+num(v);}

  // ---------- canvas ----------
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W_=600,H_=280,SC=1;
  function sizeCanvas(){var w=Math.round(cv.clientWidth)||600,h=Math.round(cv.clientHeight)||280,dpr=window.devicePixelRatio||1;W_=w;H_=h;SC=dpr;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  function labs(c){var p=c.parentElement,Ly=p.querySelector('.cvlab');if(!Ly){Ly=document.createElement('div');Ly.className='cvlab';p.appendChild(Ly);}Ly.innerHTML='';
    return function(tex,x,y,o){o=o||{};var s=document.createElement('span');K(tex,s);var pr=document.createElement('span');pr.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';s.appendChild(pr);
      s.style.left=x+'px';s.style.top='0px';s.style.transform='translateX('+(o.align==='right'?'-100%':'0')+')';Ly.appendChild(s);var sr=s.getBoundingClientRect(),base=pr.getBoundingClientRect().top-sr.top;s.style.top=(y-base)+'px';};}
  function dotR(n){return n<=20?6:n<=60?5:4;}
  function dotAt(g,x,y,yv,pr,r){g.fillStyle=yv?'rgba(224,122,95,0.92)':'rgba(91,143,185,0.88)';g.beginPath();g.arc(x,y,r,0,7);g.fill();   // สี = actual class · ✗ ขาว = ทำนายผิด
    if(pr!==yv){var q=r*0.6;g.strokeStyle='#fff';g.lineWidth=1.8;g.beginPath();g.moveTo(x-q,y-q);g.lineTo(x+q,y+q);g.moveTo(x+q,y-q);g.lineTo(x-q,y+q);g.stroke();}}
  function draw(M,fk,TR,cnt){var g=ctx;g.setTransform(SC,0,0,SC,0,0);g.clearRect(0,0,W_,H_);
    var L=34,Rm=12,TOP=40,BOT=32,pw=W_-L-Rm,ph=H_-TOP-BOT,x0=L,x1=L+pw,y0=TOP,y1=TOP+ph,i,j,st=5;
    function px(v){return x0+(v-LO)/(HI-LO)*pw;} function py(v){return y1-(v-LO)/(HI-LO)*ph;}
    for(i=x0;i<x1;i+=st)for(j=y0;j<y1;j+=st){var gx=LO+(i+st/2-x0)/pw*(HI-LO),gy=LO+(y1-(j+st/2))/ph*(HI-LO);
      g.fillStyle=M.post(phi([gx,gy],fk))>0.5?'rgba(224,122,95,0.16)':'rgba(91,143,185,0.16)';g.fillRect(i,j,Math.min(st,x1-i),Math.min(st,y1-j));}
    g.strokeStyle='rgba(128,128,128,0.45)';g.lineWidth=1;g.strokeRect(x0,y0,pw,ph);
    g.fillStyle='rgba(128,128,128,0.9)';g.font='13px KaTeX_Main,serif';g.textAlign='center';g.textBaseline='alphabetic';for(var a=0;a<=10;a+=2)g.fillText(String(a),px(a),y1+15);
    g.textAlign='right';g.textBaseline='middle';for(var b=0;b<=10;b+=2)g.fillText(String(b),x0-6,py(b));g.textBaseline='alphabetic';
    var lb=labs(cv);lb('x_2',x0+4,y0-8);lb('x_1',x1,y1+29,{align:'right'});
    var r=dotR(TR.X.length);for(i=0;i<TR.X.length;i++){var v=TR.X[i];dotAt(g,px(v[0]),py(v[1]),TR.y[i],M.post(phi(v,fk))>0.5?1:0,r);}
    g.font='13px KaTeX_Main,serif';g.textBaseline='middle';var cxr=x1,cyr=y0-29;   // ป้ายนับ (สัญลักษณ์ = จุดแบบเดียวกับในกราฟ)
    [['TN',cnt.TN,0,0],['FP',cnt.FP,0,1],['FN',cnt.FN,1,0],['TP',cnt.TP,1,1]].forEach(function(c){var s=c[0]+' '+c[1];g.fillStyle='#444';g.textAlign='right';g.fillText(s,cxr,cyr);cxr-=g.measureText(s).width+9;dotAt(g,cxr,cyr,c[2],c[3],5);cxr-=5+14;});g.textBaseline='alphabetic';}

  // ---------- legend / table / calc ----------
  function clLine(name,lc,tc,shape){return '<span class="cli"><i class="'+(shape||'ln')+'" style="background:'+lc+'"></i><span>'+kx('\\textcolor{'+tc+'}{\\text{'+name+'}}')+'</span></span>';}
  function fillLegend(){document.getElementById('classleg').innerHTML=clLine('Positive class','#E07A5F',Rd,'ar')+clLine('Negative class','#5B8FB9',Bl,'ar')+clLine('Misclassified (✗)','#888','#666')+clLine('Predicted region',MC,MC,'ar');}
  function fillTab(M,fk,TR){var F=FT(fk),hasP=(model!=='tree'),Wt=function(t){return '\\textcolor{#fff}{'+t+'}';};
    document.getElementById('mthead').innerHTML=F.names.concat(hasP?['\\hat p']:[]).concat(['\\text{Actual}','\\text{Predicted}']).map(function(t){return '<th>'+kx(Wt(t))+'</th>';}).join('');
    var idx=TR.X.map(function(_,i){return i;}).sort(function(a,b){return TR.X[b][0]-TR.X[a][0];}),h='';
    function cls(y){return y?'\\textcolor{'+Rd+'}{+}':'\\textcolor{'+Bl+'}{-}';}
    idx.forEach(function(i){var f=phi(TR.X[i],fk),p=M.post(f),yh=p>0.5?1:0,y=TR.y[i],k=y?(yh?'tp':'fn'):(yh?'fp':'tn');
      h+='<tr class="'+k+'">'+f.map(function(v,j){return '<td'+(j>=2?' class="fe"':'')+'>'+kx(v.toFixed(1))+'</td>';}).join('')+(hasP?'<td>'+kx(p.toFixed(2))+'</td>':'')+'<td>'+kx(cls(y))+'</td><td>'+kx(cls(yh))+'</td></tr>';});
    document.getElementById('mtbody').innerHTML=h;}
  function lline(t,parts,cls){return '<span class="ln'+(cls||'')+'"><span class="lb">'+(t?kx('\\text{'+t+'}'):'')+'</span><span class="bd">'+parts.map(function(p){return '<span>'+kx(p)+'</span>';}).join('')+'</span></span>';}
  function fillCalc(M,fk,accs){var F=FT(fk),h='',fe=TABS[curTab].fe;
    if(fe)h+=lline('Features',['\\boldsymbol\\phi(\\mathbf x)=('+F.names.join(',\\ ')+')']);
    if(model==='logistic'){var s=num(M.C[0]);if(M.C[0]<0)s='-'+s;F.names.forEach(function(nm,j){s+=sgn(M.C[j+1])+'\\,'+nm;});
      // feature ดิบ 2 ตัว: แทนค่าลงใน exp ได้ในบรรทัดเดียว (เหมือน Intro) · feature เพิ่ม → สมการยาวเกินกล่อง จึงแยก z(x) ไว้บรรทัดถัดไป
      h+=(F.names.length<=2?lline('Probabilistic model',['\\hat p(\\mathbf x)=\\dfrac{1}{1+\\exp(-('+s+'))}','\\quad\\text{or}'])
          :lline('Probabilistic model',['\\hat p(\\mathbf x)=\\dfrac{1}{1+\\exp(-z(\\mathbf x))}','\\quad\\text{or}'])+lline('',['z(\\mathbf x)='+s],' tr'))+lline('Decision rule',['\\text{if }\\hat p(\\mathbf x)>0.5\\text{ then }'+POS()+'\\text{, else }'+NEG()]);}
    else if(model==='nb')h+=lline('Probabilistic model',['\\hat p(\\mathbf x)\\propto\\pi_+\\textstyle\\prod_j\\mathcal N(\\phi_j;\\ \\bar\\phi_{j+},\\ s_{j+}^2)','\\quad\\text{or}'])+lline('Decision rule',['\\text{if }\\hat p(\\mathbf x)>0.5\\text{ then }'+POS()+'\\text{, else }'+NEG()]);
    else if(model==='knn')h+=lline('Probabilistic model',['\\hat p(\\mathbf x)=\\dfrac{1}{k}\\sum_{i\\in N_k(\\mathbf x)}y_i,','k='+M.k,'\\quad\\text{or}'])+lline('Decision rule',[M.k===1?'y=\\text{class of the nearest point}':'y=\\text{majority of the }'+M.k+'\\text{ nearest points}']);
    else{var first=true,ind=function(tex,dp){var t=first?'Decision rule':'';first=false;return '<span class="ln tr"><span class="lb">'+(t?kx('\\text{'+t+'}'):'')+'</span><span class="bd" style="padding-left:'+(dp*24)+'px"><span>'+kx(tex)+'</span></span></span>';};
      (function walk(nd,dp){if(nd.leaf){h+=ind('\\text{always }'+(nd.p>0.5?POS():NEG()),dp);return;}var lf=function(k){return k.leaf?'\\ '+(k.p>0.5?POS():NEG()):'';};
        h+=ind('\\textbf{if }'+F.names[nd.f]+'<'+nd.t.toFixed(2)+'\\textbf{ then}'+lf(nd.left),dp);if(!nd.left.leaf)walk(nd.left,dp+1);h+=ind('\\textbf{else}'+lf(nd.right),dp);if(!nd.right.leaf)walk(nd.right,dp+1);})(M.root,0);}
    // เทียบ: แท็บ 1 = 4 แบบจำลองบน feature ดิบ · แท็บ 2 = 3 ชุด feature ของแบบจำลองที่เลือก (ตัวที่กำลังแสดง = ตัวหนาสีกรมท่า)
    h+=lline('Test accuracy',accs.map(function(a){return (a.on?'\\textcolor{'+MC+'}{\\boldsymbol{':'{{')+a.n+'\\ '+a.v.toFixed(2)+'}}'+(a.last?'':'\\ \\cdot');}),' lnwr');   /* ชื่อคลาสห้ามใช้ "wrap" — ชนกับ .wrap (กรอบหน้า) ใน pg_style.css */   // ยาวเกิน → ตัดบรรทัดระหว่างรายการ (ไม่ย่อฟอนต์)
    var el=document.getElementById('mcalc');el.innerHTML=h;
    el.className='excalc'+(el.querySelectorAll('.ln.tr').length>9?' sm':'');   // กฎของ tree ยาว (ลึก 3 เต็มต้น ≈ 14 บรรทัด) → ตัวเล็กลง บรรทัดชิดขึ้น หน้าไม่ scroll
    Array.prototype.forEach.call(el.querySelectorAll('.ln:not(.lnwr)>.bd'),function(bd){var av=bd.clientWidth-parseFloat(bd.style.paddingLeft||0)-4,w=0;Array.prototype.forEach.call(bd.children,function(s){w+=s.getBoundingClientRect().width+5;});
      if(w>av&&av>0){var fs=parseFloat(getComputedStyle(bd).fontSize);bd.style.fontSize=Math.max(10,Math.floor(fs*av/w*10)/10)+'px';}});}

  // ---------- static labels ----------
  var MT={'h1':'\\text{Model \\& Feature Comparison}','hd-pat':'\\text{Data}','hd-model':'\\text{Model}','hd-hp':'\\text{Model setting}','hd-feat':'\\text{Features}',
    'lbl-n':'n','lbl-noise':'\\text{Noise}','lbl-k':'k','lbl-depth':'\\text{Depth}','resample':'\\text{Resample points}'};
  function renderTexts(){for(var id in MT)K(MT[id],document.getElementById(id));var k;for(k in PATS)K(PATS[k],document.getElementById('pt-'+k));
    MODELS.forEach(function(m){K(m.n,document.getElementById('sb-'+m.k));});FEATS.forEach(function(f){K(f.n,document.getElementById('ft-'+f.k));});}
  function setSeg(id,v){var bs=document.querySelectorAll('#'+id+' button');for(var i=0;i<bs.length;i++)bs[i].className=(bs[i].getAttribute('data-v')===v)?'on':'';}

  // ---------- update ----------
  function upd(){var n=Math.round(gv('n')),noise=gv('noise'),kMax=Math.max(1,n%2?n:n-1);
    ['Rk','Nk'].forEach(function(id){document.getElementById(id).max=kMax;});if(gv('k')>kMax)sv('k',kMax);   // k: เลขคี่ ไม่เกิน n
    var fe=TABS[curTab].fe,fk=FK();
    document.getElementById('grp-feat').style.display=fe?'':'none';
    document.getElementById('row-k').style.display=model==='knn'?'':'none';document.getElementById('row-depth').style.display=model==='tree'?'':'none';
    document.getElementById('hd-hp').style.display=(model==='knn'||model==='tree')?'':'none';
    setSeg('patSeg',pat);setSeg('modelSeg',model);setSeg('featSeg',feat);
    var TR=gen(U,n,noise),TE=gen(TU,NTEST,noise),M=fit(model,fk,TR),cnt={TP:0,FN:0,FP:0,TN:0},i;
    for(i=0;i<n;i++){var p=M.post(phi(TR.X[i],fk))>0.5;if(TR.y[i]){if(p)cnt.TP++;else cnt.FN++;}else{if(p)cnt.FP++;else cnt.TN++;}}
    var accs=fe?FEATS.map(function(f,j){return {n:f.s||f.n,v:acc(f.k===fk?M:fit(model,f.k,TR),f.k,TE),on:f.k===fk,last:j===FEATS.length-1};})
               :MODELS.map(function(m,j){return {n:m.s||m.n,v:acc(m.k===model?M:fit(m.k,'raw',TR),'raw',TE),on:m.k===model,last:j===MODELS.length-1};});
    fillTab(M,fk,TR);fillCalc(M,fk,accs);fillLegend();sizeCanvas();draw(M,fk,TR,cnt);
    // ตารางสูงอย่างน้อย 20 แถว (หรือเท่าคอลัมน์กราฟ) ไม่เกินขอบจอ — เกินนั้นเลื่อนในตาราง
    var dl=document.getElementById('dleft'),mn=document.getElementById('main');
    if(innerWidth>820){var rw=document.querySelectorAll('#mtbody tr'),h20=rw.length?Math.ceil(rw[Math.min(19,rw.length-1)].getBoundingClientRect().bottom-document.getElementById('mtab').getBoundingClientRect().top)+2:0;
      var cap=Math.max(200,innerHeight-Math.round(dl.getBoundingClientRect().top+window.scrollY)-10);dl.style.maxHeight=Math.min(cap,Math.max(Math.round(mn.getBoundingClientRect().height),h20))+'px';}else dl.style.maxHeight='300px';
    if(Math.round(cv.clientWidth)!==W_||Math.round(cv.clientHeight)!==H_){sizeCanvas();draw(M,fk,TR,cnt);}}

  // ---------- controls ----------
  var tb=document.getElementById('tabs');
  TABS.forEach(function(t,i){var el=document.createElement('button');el.className='tabbtn'+(i===0?' on':'');K(t.n,el);el.addEventListener('click',function(){curTab=i;var bs=document.querySelectorAll('.tabbtn');for(var j=0;j<bs.length;j++)bs[j].className='tabbtn'+(j===i?' on':'');upd();});tb.appendChild(el);});
  [['patSeg',function(v){pat=v;}],['modelSeg',function(v){model=v;}],['featSeg',function(v){feat=v;}]].forEach(function(q){
    document.querySelectorAll('#'+q[0]+' button').forEach(function(b){b.addEventListener('click',function(){q[1](b.getAttribute('data-v'));upd();});});});
  ['n','noise','k','depth'].forEach(function(b){var Re=document.getElementById('R'+b),Ne=document.getElementById('N'+b);
    Re.addEventListener('input',function(){Ne.value=Re.value;upd();});Ne.addEventListener('input',function(){Re.value=Ne.value;upd();});});
  document.getElementById('resample').addEventListener('click',function(){seed=(seed*1664525+1013904223)>>>0;regen(seed);upd();});
  window.addEventListener('resize',function(){upd();});

  renderTexts();upd();
  requestAnimationFrame(function(){renderTexts();upd();});
  setTimeout(function(){renderTexts();upd();},300);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){upd();});
})();
</script>
