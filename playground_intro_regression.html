<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction to Regression</title>
<link rel="stylesheet" href="pg_style.css?v=24">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>
  /* intro-regression — โครงเดียวกับ Introduction to Classification: ตารางข้อมูลซ้าย · กราฟ + legend + กล่องคำนวณขวา · control ขวาสุด */
  .layout{align-items:start}
  .pg.distcls .canvasbox{height:260px}   /* เท่ากับ Intro to Classification (คงที่ทุกโมเดล/ทุกแท็บ) */
  .distcls .stage{gap:6px}
  .canvasbox{position:relative}
  .cvlab{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;font-size:14px;line-height:1}   /* มาตรฐาน: ตัวอักษรบนกราฟ ≥ 14px */
  .cvlab>span{position:absolute;white-space:nowrap;color:rgba(90,90,90,0.9)}   /* เฉพาะลูกตรง — ห้ามโดน span ภายในของ KaTeX */
  .cvlab .katex{font-size:1em}
  /* กล่องคำนวณ: ป้ายกำกับ (chip) + ชิ้นสมการที่ตัดบรรทัดระหว่างชิ้นได้ · สมการ 14px ไม่ย่อ */
  .excalc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 6px;font-size:14px;line-height:1.38;overflow:hidden}
  .excalc .katex{font-size:1em}
  .excalc .ln{display:block;padding:1px 0}
  .excalc .ln>.lb{display:inline-block;margin:0 10px 2px 0;padding:1px 9px;border-radius:6px;background:#E6ECF8;color:var(--navy);font-size:13px;vertical-align:middle}
  .excalc .ln>.lb:empty{display:none}
  .excalc .ln>.bd{display:inline}
  .excalc .ln>.bd>span{display:inline-block;margin-right:.35em;vertical-align:middle;white-space:nowrap}
  .excalc .ln.tr>.bd{display:block}
  .excalc .ln.tr.first>.bd{display:inline}
  .excalc .ln:not(.tr)+.ln,.excalc .ln.tr+.ln:not(.tr){border-top:1px solid var(--line);padding-top:2px;margin-top:2px}
  .excalc .ln.tr{margin:0;padding:0;line-height:1.08}   /* กฎของ tree (ลึก 3 = ได้ถึง ~15 บรรทัด) → บรรทัดชิดกัน */
  .dtab{width:100%;border-collapse:collapse;font-size:15px}
  .dtab th{background:var(--navy);color:#fff;font-weight:400;padding:5px 5px;text-align:center;position:sticky;top:0;z-index:3}
  .dtab td{padding:1px 6px;text-align:center;color:var(--ink);line-height:1.35;background:#fff}
  .dtab tr.hl td{background:#E6ECF8}   /* จุดที่ใช้คำนวณ ŷ ของ testing point (k-NN = เพื่อนบ้าน k จุด · tree = จุดในใบเดียวกัน) */
  .dtab .katex{font-size:1em}
  .panel{max-height:calc(100vh - 96px);overflow-y:auto;overflow-x:hidden}
  .seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .seg2 button{flex:1 1 auto;font:inherit;font-size:14px;padding:6px 8px;border:0;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
  .seg2 button.on{background:var(--navy);color:#fff}
  .seg2 .katex{font-size:1em}
  .tgls{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .distcls .below{min-height:0;padding:6px 14px 8px}
  .below .excalc{width:100%;box-sizing:border-box}
  .stage.mod{flex-direction:row;gap:18px;align-items:flex-start}
  .dleft{display:block;flex:0 0 362px;min-width:0;overflow-y:auto;overflow-x:hidden;border-radius:8px;position:relative}   /* relative: ชิ้น absolute ของ KaTeX ในแถวที่เลื่อนพ้นต้องถูก clip */
  .main{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-width:0}
  .pg .panel .dgrid{row-gap:5px}
  /* legend: สี่เหลี่ยม/เส้น แบบเดียวกับ playground จำแนก · วง = จุดที่ใช้คำนวณ testing point · แถบสี = สเกลของ y และ ŷ (bivariate) */
  .classleg .cli .ring{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #1e3a8a;box-sizing:border-box;flex:none}
  .classleg .cli .dotg{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(60,60,60,.55)}
  .classleg .cli .scale{display:inline-flex;border-radius:3px;overflow:hidden;margin:0 2px;flex:none}
  .classleg .cli .scale i{display:inline-block;width:13px;height:11px}
  @media(max-width:820px){.stage.mod{flex-direction:column}.dleft{flex:none;width:100%}}
</style>
</head>
<body class="pg distcls">
<div class="wrap">
  <div class="hdr"><h1 id="h1">Introduction to Regression</h1><div class="tabs" id="tabs"></div></div>

  <div class="layout" id="mainPanel">
    <!-- ตารางข้อมูลซ้าย (x | y | ŷ | y − ŷ) · ขวา = กราฟ → legend → การคำนวณของแบบจำลองที่เลือก -->
    <div class="stage mod">
      <div class="dleft" id="dleft"><table class="dtab" id="mtab"><thead><tr id="mthead"></tr></thead><tbody id="mtbody"></tbody></table></div>
      <div class="main" id="main">
        <div class="canvasbox"><canvas id="cv"></canvas></div>
        <div class="classleg" id="classleg"></div>
        <div class="below"><div class="excalc" id="mcalc"></div></div>
      </div>
    </div>

    <!-- CONTROL: ข้อมูล → แบบจำลอง → testing point → Resample (ลำดับเดียวกับ Intro to Classification) -->
    <div class="panel">
      <div id="grp-rel"><div class="dhd" id="hd-rel"></div>
      <div class="seg2" id="relSeg"><button data-r="0" id="rel-0" class="on"></button><button data-r="1" id="rel-1"></button></div></div>
      <div id="grp-data"><div class="dhd" id="hd-data"></div>
      <div class="dgrid">
        <div class="drow" id="row-sg"><span class="dlab" id="lbl-sg"></span><input type="range" id="Rsg" min="0.5" max="6" step="0.5" value="2"><input class="num" type="number" id="Nsg" min="0.5" max="6" step="0.5" value="2"></div>
        <div class="drow" id="row-n"><span class="dlab" id="lbl-n"></span><input type="range" id="Rn" min="10" max="100" step="10" value="20"><input class="num" type="number" id="Nn" min="10" max="100" step="10" value="20"></div>
      </div></div>
      <div id="grp-model"><div class="dhd" id="hd-model"></div>
      <div class="seg2" id="modelSeg">
        <button data-m="knn" id="sb-knn" class="on"></button><button data-m="tree" id="sb-tree"></button><button data-m="lin" id="sb-lin"></button><button data-m="poly" id="sb-poly"></button>
      </div>
      <div class="dhd" id="hd-hp"></div>
      <div class="dgrid">
        <div class="drow" id="row-k"><span class="dlab" id="lbl-k"></span><input type="range" id="Rk" min="1" max="20" step="1" value="1"><input class="num" type="number" id="Nk" min="1" max="20" step="1" value="1"></div>
        <div class="drow" id="row-depth"><span class="dlab" id="lbl-depth"></span><input type="range" id="Rdepth" min="1" max="2" step="1" value="2"><input class="num" type="number" id="Ndepth" min="1" max="2" step="1" value="2"></div>
        <div class="drow" id="row-deg"><span class="dlab" id="lbl-deg"></span><input type="range" id="Rdeg" min="2" max="5" step="1" value="2"><input class="num" type="number" id="Ndeg" min="2" max="5" step="1" value="2"></div>
      </div></div>
      <div id="grp-ex"><div class="dhd" id="hd-ex"></div>
      <div class="dgrid">
        <div class="drow" id="row-x0"><span class="dlab" id="lbl-x0"></span><input type="range" id="Rx0" min="80" max="200" step="0.5" value="140"><input class="num" type="number" id="Nx0" min="80" max="200" step="0.5" value="140"></div>
        <div class="drow" id="row-xy0"><span class="dlab" id="lbl-xy0"></span><input type="range" id="Rxy0" min="5" max="10" step="0.05" value="7.5"><input class="num" type="number" id="Nxy0" min="5" max="10" step="0.05" value="7.5"></div>
      </div></div>
      <div id="grp-rs" class="tgls"><button class="primary" id="resample" style="width:100%"></button></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---------- rng (seed คงที่ → เปิดหน้าใหม่ได้ข้อมูลชุดเดิม · Resample = seed ใหม่) ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var MAXN=100,U1=[],U2=[],ZN=[];
  function regen(s){var rng=mulberry32(s),i;function g(){var u=rng()||1e-9,v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
    U1=[];U2=[];ZN=[];for(i=0;i<MAXN;i++){U1.push(rng());U2.push(rng());ZN.push(g());}}
  var seed=12345;regen(seed);

  // ---------- ข้อมูลจำลองบนตัวแปรของปั๊ม (ชุดเดียวกับ Intro to Classification: flow, pressure) ----------
  //   lin: motor current (A) เพิ่มตาม flow เกือบเป็นเส้นตรง · cur: discharge pressure (bar) ตกตาม flow แบบ pump curve p = p0 − a·Q² (โค้ง)
  //   bi : current จาก flow และ pressure — กำลังไฮดรอลิก ∝ Q·p → ผิว ŷ โค้ง (มีพจน์ x1·x2)
  //   ค่า x, y ปัดเท่าจำนวนทศนิยมที่แสดงในตาราง → คำนวณตามตารางแล้วได้ผลตรงกัน
  var DS={
    lin:{nm:['flow'],yn:'current',xr:[[80,200]],xdec:[1],ydec:1,sg:[0.5,6,0.5],qst:[0.5],f:function(x){return 18+0.22*x[0];}},
    cur:{nm:['flow'],yn:'pressure',xr:[[80,200]],xdec:[1],ydec:2,sg:[0.05,0.6,0.05],qst:[0.5],f:function(x){return 11-1.6e-4*x[0]*x[0];}},
    bi:{nm:['flow','pressure'],yn:'current',xr:[[80,200],[5,10]],xdec:[1,2],ydec:1,sg:[0.5,6,0.5],qst:[0.5,0.05],f:function(x){return 10+0.028*x[0]*x[1];}}};
  var MEM={lin:{sg:2,n:20},cur:{sg:0.2,n:20},bi:{sg:2,n:20}};   // ทุกชุดเริ่มที่ n = 20 เท่ากับ Intro to Classification
  var QM={};   // testing point จำแยกตามชุดข้อมูล
  var TABS=[{n:'Univariate',dim:1},{n:'Bivariate',dim:2}];
  var curTab=0,rel=0,modeM='knn';   // ลำดับแบบจำลอง: k-NN (เริ่มที่ k = 1) → Tree → Linear → Polynomial
  var MC='#1e3a8a',Rd='#B0503A',MV='#B07AAE',MVt='#7E5A93';
  function T(){return TABS[curTab];} function dim(){return T().dim;}
  function key(){return dim()===2?'bi':(rel?'cur':'lin');} function C(){return DS[key()];}
  function gv(b){return parseFloat(document.getElementById('R'+b).value);}
  function sv(b,v){document.getElementById('R'+b).value=v;document.getElementById('N'+b).value=v;}
  function setRange(b,r){['R','N'].forEach(function(p){var e=document.getElementById(p+b);e.min=r[0];e.max=r[1];e.step=r[2];});}
  function rnd(v,d){var p=Math.pow(10,d);return Math.round(v*p)/p;}
  function dataset(){var c=C(),n=Math.round(gv('n')),sg=gv('sg'),X=[],y=[],k,D=c.xr.length;
    for(k=0;k<n;k++){var x=[rnd(c.xr[0][0]+(c.xr[0][1]-c.xr[0][0])*U1[k],c.xdec[0])];
      if(D===2)x.push(rnd(c.xr[1][0]+(c.xr[1][1]-c.xr[1][0])*U2[k],c.xdec[1]));
      X.push(x);y.push(rnd(c.f(x)+sg*ZN[k],c.ydec));}
    return {X:X,y:y,D:D,sym:D===1?['x']:['x_1','x_2'],c:c};}

  // ---------- estimators: ทุกตัวให้ ŷ(x) = ค่าประมาณของ E[y | x] ----------
  function colStats(X){var D=X[0].length,mu=[],sd=[],d,i;for(d=0;d<D;d++){var m=0,q=0;for(i=0;i<X.length;i++)m+=X[i][d];m/=X.length;
    for(i=0;i<X.length;i++)q+=(X[i][d]-m)*(X[i][d]-m);mu.push(m);sd.push(Math.sqrt(q/Math.max(1,X.length-1))||1);}return {mu:mu,sd:sd};}
  function solve(A,b){var n=b.length,i,j,k;for(i=0;i<n;i++){var p=i;for(k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[p][i]))p=k;var t=A[i];A[i]=A[p];A[p]=t;var tb=b[i];b[i]=b[p];b[p]=tb;
      if(Math.abs(A[i][i])<1e-12)continue;for(k=i+1;k<n;k++){var f=A[k][i]/A[i][i];for(j=i;j<n;j++)A[k][j]-=f*A[i][j];b[k]-=f*b[i];}}
    var x=new Array(n);for(i=n-1;i>=0;i--){var s=b[i];for(j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=Math.abs(A[i][i])<1e-12?0:s/A[i][i];}return x;}
  // least squares ผ่าน normal equations (ΦᵀΦ + λI)w = Φᵀy · λ เล็กมากกันเมทริกซ์เอกฐาน (n น้อย / degree สูง) ไม่ลงโทษ intercept
  function lsq(Phi,y,lam){var D=Phi[0].length,A=[],b=[],i,j,r;for(i=0;i<D;i++){A.push(new Array(D).fill(0));b.push(0);}
    for(r=0;r<Phi.length;r++){var p=Phi[r];for(i=0;i<D;i++){b[i]+=p[i]*y[r];for(j=0;j<D;j++)A[i][j]+=p[i]*p[j];}}
    for(i=1;i<D;i++)A[i][i]+=lam;return solve(A,b);}
  // linear: ฟิตบนคอลัมน์ standardise แล้วแปลงสัมประสิทธิ์กลับเป็นหน่วยดิบ (สมการในกล่องคำนวณใช้ x ตรง ๆ)
  function fitLinear(X,y){var S=colStats(X),D=X[0].length,d;
    var w=lsq(X.map(function(x){return [1].concat(x.map(function(v,j){return (v-S.mu[j])/S.sd[j];}));}),y,1e-9),Cf=[w[0]];
    for(d=0;d<D;d++){Cf.push(w[d+1]/S.sd[d]);Cf[0]-=w[d+1]*S.mu[d]/S.sd[d];}
    return {kind:'lin',C:Cf,post:function(v){var s=Cf[0];for(var j=0;j<v.length;j++)s+=Cf[j+1]*v[j];return s;}};}
  // polynomial: ฟีเจอร์ = กำลังของ z = (x − x̄)/s (สัมประสิทธิ์บนหน่วยดิบของ x⁵ เล็กจนอ่านไม่ได้) · 2-D = ทุกพจน์ z1^a z2^b ที่ a + b ≤ degree
  function polyTerms(D,deg){var t=[],g,a;if(D===1){for(g=1;g<=deg;g++)t.push([g]);return t;}
    for(g=1;g<=deg;g++)for(a=g;a>=0;a--)t.push([a,g-a]);return t;}
  function fitPoly(X,y,deg){var S=colStats(X),D=X[0].length,TM=polyTerms(D,deg);
    function feats(v){var z=[],d,j,out=[1];for(d=0;d<D;d++)z.push((v[d]-S.mu[d])/S.sd[d]);
      for(j=0;j<TM.length;j++){var p=1;for(d=0;d<D;d++)p*=Math.pow(z[d],TM[j][d]);out.push(p);}return out;}
    var w=lsq(X.map(feats),y,1e-6);
    return {kind:'poly',S:S,TM:TM,w:w,post:function(v){var f=feats(v),s=0;for(var j=0;j<f.length;j++)s+=w[j]*f[j];return s;}};}
  // k-NN: ŷ = ค่าเฉลี่ย y ของ k จุดที่ใกล้ที่สุด (ระยะบนคอลัมน์ที่หารด้วย s.d.) · insertion k-smallest (พื้นกราฟ 2-D เรียกหลายหมื่นครั้ง)
  function fitKNN(X,y,k){var n=X.length,D=X[0].length;k=Math.max(1,Math.min(k,n));var sc=colStats(X).sd,bd=new Float64Array(k),bi=new Int32Array(k),m=0;
    function find(v){var i,d,j;m=0;for(i=0;i<n;i++){var s=0;for(d=0;d<D;d++){var t=(X[i][d]-v[d])/sc[d];s+=t*t;}
      if(m<k||s<bd[m-1]){j=m;if(m===k)j=k-1;else m++;while(j>0&&bd[j-1]>s){bd[j]=bd[j-1];bi[j]=bi[j-1];j--;}bd[j]=s;bi[j]=i;}}}
    return {kind:'knn',k:k,post:function(v){find(v);var s=0;for(var i=0;i<m;i++)s+=y[bi[i]];return s/m;},
      used:function(v){find(v);return Array.prototype.slice.call(bi,0,m);}};}
  // regression tree: แบ่งที่ลด Σ(y − ȳ)² ได้มากที่สุด · ใบ = ค่าเฉลี่ย y ของจุดในใบ
  function fitTree(X,y,depth){var n=X.length,D=X[0].length,all=[],i;for(i=0;i<n;i++)all.push(i);
    function build(idx,dp){var m=idx.length,s=0,s2=0,j,f;for(j=0;j<m;j++){s+=y[idx[j]];s2+=y[idx[j]]*y[idx[j]];}var tot=s2-s*s/m;
      if(dp>=depth||m<4||tot<1e-12)return {leaf:true,v:s/m,idx:idx};
      var best=null;
      for(f=0;f<D;f++){var srt=idx.slice().sort(function(a,b){return X[a][f]-X[b][f];}),ls=0,lq=0;
        for(j=1;j<m;j++){var yy=y[srt[j-1]];ls+=yy;lq+=yy*yy;if(X[srt[j]][f]===X[srt[j-1]][f])continue;
          var rs=s-ls,rq=s2-lq,g=(lq-ls*ls/j)+(rq-rs*rs/(m-j));
          if(best===null||g<best.g)best={g:g,f:f,t:(X[srt[j-1]][f]+X[srt[j]][f])/2};}}
      if(!best||best.g>=tot-1e-12)return {leaf:true,v:s/m,idx:idx};
      var L=[],R=[];for(j=0;j<m;j++)(X[idx[j]][best.f]<best.t?L:R).push(idx[j]);
      return {leaf:false,f:best.f,t:best.t,left:build(L,dp+1),right:build(R,dp+1)};}
    var root=build(all,0);
    function leaf(v){var nd=root;while(!nd.leaf)nd=(v[nd.f]<nd.t)?nd.left:nd.right;return nd;}
    return {kind:'tree',root:root,post:function(v){return leaf(v).v;},used:function(v){return leaf(v).idx.slice();}};}

  // ---------- KaTeX ----------
  var MT={'h1':'\\text{Introduction to Regression}','resample':'\\text{Resample points}',
    'hd-rel':'\\text{Relationship}','rel-0':'\\text{Linear}','rel-1':'\\text{Curved}',
    'hd-data':'\\text{Noise \\& size}','lbl-sg':'\\sigma','lbl-n':'n',
    'hd-model':'\\text{Model}','hd-hp':'\\text{Model setting}','hd-ex':'\\text{Testing point}',
    'sb-knn':'k\\text{-NN}','sb-tree':'\\text{Tree}','sb-lin':'\\text{Linear}','sb-poly':'\\text{Polynomial}',
    'lbl-k':'k','lbl-depth':'\\text{Depth}','lbl-deg':'\\text{Degree}','lbl-xy0':'x_{2,\\text{test}}'};
  var KXC={};
  function kx(t){if(KXC[t]!==undefined)return KXC[t];var r;try{r=window.katex?katex.renderToString(t,{throwOnError:false}):t;}catch(e){r=t;}if(t.length<24&&window.katex)KXC[t]=r;return r;}
  function K(t,el){if(!el)return;try{katex.render(t,el,{throwOnError:false});}catch(e){el.textContent=t;}}
  function renderTexts(){if(!window.katex)return;for(var id in MT)K(MT[id],document.getElementById(id));
    K(dim()===2?'x_{1,\\text{test}}':'x_{\\text{test}}',document.getElementById('lbl-x0'));}
  function fx(v,d){return (Math.abs(v)<Math.pow(10,-d)/2?0:v).toFixed(d);}
  // สัมประสิทธิ์: 4 หลักนัยสำคัญ (ความชัน A ต่อ m³/h ≈ 0.2 · bar ต่อ m³/h ≈ 0.03) · เล็กมากเขียน ×10ⁿ
  function num(v){var a=Math.abs(v);if(a<1e-12)return '0';

    var P={D:D,c:c,sym:S.sym,X:S.X,y:S.y,m:m,Q:Q,used:m.used?m.used(Q):[],xmin:r0[0]-px0,xmax:r0[1]+px0,ymin:lo-py0,ymax:hi+py0};
    if(D===2){var r1=c.xr[1],p1=(r1[1]-r1[0])*0.03;P.x2min=r1[0]-p1;P.x2max=r1[1]+p1;
      var bs=niceStep(lo,hi,7).step,b0=Math.floor(lo/bs)*bs,b1=Math.ceil(hi/bs)*bs,nb=Math.max(1,Math.round((b1-b0)/bs)),cols=[];   /* แถบสีของพื้น: ช่วงละ bs ครอบคลุมช่วง y ของข้อมูล */
      for(var i=0;i<nb;i++)cols.push(cmap((i+0.5)/nb));P.band={lo:b0,hi:b1,step:bs,cols:cols};}
    sizeCanvas();draw(P);fillCalc(P);fillTable(P);fillLegend(P);
    var dl=document.getElementById('dleft'),mn=document.getElementById('main');   // ตารางสูงอย่างน้อย 20 แถว (เกินจึงเลื่อน) ไม่เกินขอบล่างจอ
    if(innerWidth>820){var rw=document.querySelectorAll('#mtbody tr'),tbl=document.getElementById('mtab'),h20=0;
      if(rw.length)h20=Math.ceil(rw[Math.min(19,rw.length-1)].getBoundingClientRect().bottom-tbl.getBoundingClientRect().top)+2;
      var capH=Math.max(200,innerHeight-Math.round(dl.getBoundingClientRect().top+window.scrollY)-10);
      dl.style.maxHeight=Math.min(capH,Math.max(Math.round(mn.getBoundingClientRect().height),h20))+'px';}else dl.style.maxHeight='300px';
    if(Math.round(cv.clientWidth)!==W||Math.round(cv.clientHeight)!==H){sizeCanvas();draw(P);}}   // เติมตาราง/กล่องคำนวณแล้วคอลัมน์กราฟเปลี่ยนความกว้าง → ตั้งขนาดใหม่ ไม่งั้นจุดเป็นวงรี

  // ---------- controls ----------
  function setModelSeg(){document.querySelectorAll('#modelSeg button').forEach(function(b){b.className=(b.getAttribute('data-m')===modeM)?'on':'';});
    var hp={knn:'k',tree:'depth',poly:'deg'};['k','depth','deg'].forEach(function(b){document.getElementById('row-'+b).style.display=(hp[modeM]===b)?'':'none';});
    document.getElementById('hd-hp').style.display=hp[modeM]?'':'none';}   // linear ไม่มี hyperparameter → ซ่อนหัว Model setting
  function syncRows(){var c=C(),M=MEM[key()];
    document.getElementById('grp-rel').style.display=dim()===1?'':'none';document.getElementById('row-xy0').style.display=dim()===2?'':'none';
    document.querySelectorAll('#relSeg button').forEach(function(b){b.className=(+b.getAttribute('data-r')===rel)?'on':'';});
    setRange('sg',c.sg);sv('sg',M.sg);sv('n',M.n);}
  function applyTab(i){curTab=i;document.querySelectorAll('.tabbtn').forEach(function(b,j){b.className='tabbtn'+(j===i?' on':'');});
    renderTexts();syncRows();setModelSeg();sizeCanvas();upd();}
  var tb=document.getElementById('tabs');
  TABS.forEach(function(t,i){var el=document.createElement('button');el.className='tabbtn';K('\\text{'+t.n+'}',el);el.addEventListener('click',function(){applyTab(i);});tb.appendChild(el);});
  ['sg','n','k','depth','deg','x0','xy0'].forEach(function(b){var Re=document.getElementById('R'+b),Ne=document.getElementById('N'+b);
    function rem(){var v=parseFloat(Re.value);if(b==='sg'||b==='n')MEM[key()][b]=v;if(b==='x0')QM[key()+0]=v;if(b==='xy0')QM[key()+1]=v;}
    Re.addEventListener('input',function(){Ne.value=Re.value;rem();upd();});Ne.addEventListener('input',function(){Re.value=Ne.value;rem();upd();});});
  document.querySelectorAll('#modelSeg button').forEach(function(b){b.addEventListener('click',function(){modeM=b.getAttribute('data-m');setModelSeg();upd();});});
  document.querySelectorAll('#relSeg button').forEach(function(b){b.addEventListener('click',function(){rel=+b.getAttribute('data-r');syncRows();upd();});});
  document.getElementById('resample').addEventListener('click',function(){seed=(seed*1664525+1013904223)>>>0;regen(seed);upd();});
  window.addEventListener('resize',function(){sizeCanvas();upd();});

  renderTexts();applyTab(0);
  requestAnimationFrame(function(){renderTexts();upd();});
  setTimeout(function(){renderTexts();upd();},250);
  setTimeout(function(){renderTexts();upd();},800);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){upd();});
})();
