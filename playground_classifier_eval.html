<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classifier Evaluation</title>
<link rel="stylesheet" href="pg_style.css?v=24">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>
  /* classifier-evaluation — 3 แท็บตาม MLCC (Example · Threshold & metrics · ROC & AUC)
     ทุกแท็บ layout เดียวกัน: ตารางข้อมูลซ้าย · ขวา = กราฟ → confusion matrix → ตารางสูตร (แบบ Introduction to Classification)
     Example = ค่าดิบ x (PSA) กับ threshold บน x · แท็บอื่น = แบบจำลองให้ p̂ จาก x แล้ว threshold บน p̂
     โครง/ฟอนต์ = .distcls กลาง (เหมือน 1-D Bayes) · ตาราง = .mtab กลาง 15px */
  /* หน้าจอไม่พอ → เลื่อนทั้งหน้าได้ (ตารางข้อมูลแสดงครบทุกแถว) · แผงควบคุมตรึงบนขณะเลื่อน */
  html,body.pg{height:auto;overflow:auto}
  html{scrollbar-gutter:stable}   /* เผื่อที่ scrollbar เสมอ → ความกว้างหน้าเท่ากันทุกแท็บ ไม่ขยับเมื่อแท็บใดยาวกว่า */
  .pg .wrap{height:auto;max-height:none;overflow:visible}
  .pg .layout>.panel{position:sticky;top:10px}
  .layout{align-items:start}
  .distcls .stage{flex-direction:row;gap:18px;align-items:flex-start}
  .stage .main{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-width:0}
  /* ตารางข้อมูล (ซ้าย): x | (p̂) | y | ŷ — สีแถวตามผล TP/FN/FP/TN เท่ากับ confusion matrix */
  .exleft{flex:0 0 250px;min-width:0;border-radius:8px}   /* กว้างเท่ากันทุกแท็บ (หัว actual / predicted ไม่ตัดคำ) */
  .stage.wide .exleft{flex-basis:250px}
  .dtab{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
  .dtab th{background:var(--navy);color:#fff;font-weight:400;padding:5px 6px;text-align:center}
  .dtab td{padding:1px 6px;text-align:center;color:var(--ink);line-height:1.35;background:#fff}
  .dtab tr.tp td{background:#FBE9E4}.dtab tr.fn td{background:#FAEFD6}.dtab tr.fp td{background:#E3F1EE}.dtab tr.tn td{background:#E9F0F8}
  .dtab tr.cut td{border-top:2px dashed #111}   /* เส้นประ threshold ในตาราง: เหนือแถวแรกที่อยู่ใต้ threshold (predicted −) */
  .dtab .katex{font-size:1em}
  /* รูปรวม (score × actual class) = จัตุรัส 280 เท่ากันทุกแท็บ · แท็บ ROC: กราฟ ROC จัตุรัสขนาดเดียวกันวางข้าง → พอดี 1 หน้า */
  /* รูปรวมจัตุรัส 300 เท่ากันทุกแท็บ · แท็บ ROC: กราฟ ROC จัตุรัสขนาดเดียวกัน วางใต้ (บน–ล่าง) → 64+300+30+300 พอดี 1 หน้า */
  /* ขนาดจัตุรัสตามความสูงจอ: (100vh − หัว/legend/ช่องว่าง 190px) ÷ 2 อยู่ระหว่าง 200–300 → รูป + ROC ซ้อนกันพอดี 1 หน้าทุกจอ */
  /* สูงของแต่ละรูป = (100vh − หัว 64 − ช่องว่าง) ÷ 2 → รูปรวม + ROC ซ้อนกันเต็มจอพอดี · กว้างเต็มคอลัมน์ (legend ย้ายไปแผงควบคุม) */
  :root{--sq:clamp(220px,calc((100vh - 122px)/2),360px)}   /* หัว 64 + legend 30 + ช่องว่าง → รูปรวม + ROC ซ้อนกันพอดี */
  /* ตาราง metric: แท็บ Example / Threshold & metrics อยู่ใต้กราฟ (การ์ดขาว) · แท็บ ROC อยู่ในแผงควบคุม */
  .main #grp-met{margin-top:0;border-top:0;padding:8px 14px 6px;background:#fff;border:1px solid var(--line);border-radius:12px}
  .main #grp-met .mtab,.main #grp-met .mtab th,.main #grp-met .mtab td{font-size:15px}
  .pg.distcls .canvasbox{flex:1 1 auto;width:100%;height:var(--sq)}
  .toprow{display:flex;gap:16px;align-items:center}
  .toprow .canvasbox{margin:0}
  .rocbox{display:none;width:100%;height:var(--sq);box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;position:relative}
  .panel .classleg{margin-top:8px;flex-wrap:wrap}
  .main.roc .rocbox{display:block}
  .rocbox canvas{width:100%;height:100%;display:block}
  .toprow.roc .rocbox{display:block}
  /* ตาราง metric อยู่ใต้ control (ไม่กินพื้นที่คอลัมน์กราฟ) — \frac เล็ก ทศนิยม 2 ตำแหน่ง */
  #grp-met{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  .panel .mtab{width:100%;font-size:15px}
  .panel .mtab th,.panel .mtab td{padding:3px 6px;font-size:15px}
  .cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:15px;width:100%;align-items:center}
  .cm .hh{display:flex;align-items:center;justify-content:center;color:#555;font-size:17px;padding:2px 6px;text-align:center;white-space:nowrap}
  .cm .cell{border-radius:12px;padding:6px 8px;text-align:center}.cm .cell b{font-size:21px;display:block;font-variant-numeric:tabular-nums;font-weight:400}.cm .cell span{font-size:15px}
  .cm .katex{font-size:1em}
  .tp{background:#FBE9E4;color:#8A3B2C}.fn{background:#FAEFD6;color:#8A6510}.fp{background:#E3F1EE;color:#2E7D70}.tn{background:#E9F0F8;color:#3F6E99}
  .tblbox{width:100%;min-width:0}
  .pg .mtab{margin:0}
  .pg .mtab th,.pg .mtab td{padding:3px 10px;font-size:15px;vertical-align:middle;line-height:1.4}
  .pg .mtab th{white-space:normal}
  .pg .mtab th.r{text-align:right}
  .pg .mtab td{font-weight:400;color:var(--ink);font-variant-numeric:normal;text-align:left}
  .pg .mtab td:first-child{white-space:nowrap}
  .pg .mtab td .katex{white-space:nowrap}
  .pg .mtab td:last-child{text-align:right;white-space:nowrap}
  .pg .mtab th .katex,.pg .mtab td .katex{font-size:1em;line-height:1.2;vertical-align:baseline}
  .pg .mtab th.r .katex,.pg .mtab td:last-child .katex{display:block;text-align:right}
  .pg .mtab th.r .katex-html,.pg .mtab td:last-child .katex-html{display:inline-block}
  .canvasbox,.rocbox{position:relative}
  .cvlab{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;font-size:13px;line-height:1}
  .cvlab>span{position:absolute;white-space:nowrap;color:rgba(90,90,90,0.9)}
  .cvlab .katex{font-size:1em}
  .seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .seg2 button{flex:1 1 auto;font:inherit;font-size:14px;padding:6px 8px;border:0;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
  .seg2 button.on{background:var(--navy);color:#fff}
  .seg2 .katex{font-size:1em}
  .tgls{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  @media(max-width:820px){.distcls .stage{flex-direction:column}.exleft,.stage.wide .exleft{flex:none;width:100%}.pg .layout>.panel{position:static}}
</style>
</head>
<body class="pg distcls">
<div class="wrap">
  <div class="hdr"><h1 id="h1">Classifier Evaluation</h1><div class="tabs" id="tabs"></div></div>

  <div class="layout" id="mainPanel">
    <div class="stage" id="stage">
      <div class="exleft" id="exleft"><table class="dtab" id="dtab"><thead><tr id="dthead"></tr></thead><tbody id="dtbody"></tbody></table></div>
      <div class="main">
      <!-- กราฟ + confusion matrix รวมเป็นรูปเดียว (แบบ MLCC): แกนตั้ง = คะแนน · คอลัมน์ = actual +/− · เส้น threshold แบ่งแถว ŷ · นับในแต่ละช่อง -->
      <div class="toprow" id="toprow">
        <div class="canvasbox"><canvas id="cv"></canvas></div>
      </div>
      <div class="classleg" id="classleg"></div>
      <div class="rocbox" id="rocbox"><canvas id="cvroc"></canvas></div>
      <!-- #grp-met (ตาราง metric) ถูกย้ายมาไว้ตรงนี้ด้วย JS ในแท็บ Example / Threshold & metrics · แท็บ ROC อยู่ในแผงควบคุม -->
      </div>
    </div>

    <!-- CONTROL -->
    <div class="panel">
      <div id="grp-ds"><div class="dhd" id="hd-ds"></div>
      <div class="seg2" id="dsSeg"><button data-ds="0" id="ds-0" class="on"></button><button data-ds="1" id="ds-1"></button><button data-ds="2" id="ds-2"></button></div>
      <div class="dgrid">
        <div class="drow" id="row-n"><span class="dlab" id="lbl-n"></span><input type="range" id="Rn" min="10" max="20" step="2" value="20"><input class="num" type="number" id="Nn" min="10" max="20" step="2" value="20"></div>
      </div></div>
      <div id="grp-th"><div class="dhd" id="hd-th"></div>
      <div class="dgrid">
        <div class="drow" id="row-t"><span class="dlab" id="lbl-t"></span><input type="range" id="Rt" min="0.5" max="4.5" step="0.1" value="2.2"><input class="num" type="number" id="Nt" min="0.5" max="4.5" step="0.1" value="2.2"></div>
      </div></div>
      <div id="grp-rs" class="tgls"><button class="primary" id="resample" style="width:100%"></button></div>
      <div id="grp-met"><div class="dhd" id="hd-met"></div>
      <div class="tblbox"><table class="mtab" id="mtab">
        <thead><tr><th id="th-a"></th><th id="th-b"></th><th class="r" id="th-c"></th></tr></thead>
        <tbody id="mbody"></tbody>
      </table></div></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---------- rng ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var MAXN=400,Z=[];
  function regen(seed){var rng=mulberry32(seed),i;function g(){var u=rng()||1e-9,v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
    Z=[];for(i=0;i<MAXN;i++)Z.push(g());}
  var seed=20260916;regen(seed);
  function sig(z){return 1/(1+Math.exp(-z));}

  // ---------- datasets (MLCC: Separated · Unseparated · Imbalanced) บนค่าดิบ x = PSA ----------
  // x ~ N(μ_c, σ) ต่อคลาส (ปัด 1 ตำแหน่ง แบบสไลด์ PSA) · แบบจำลอง: p̂ = σ(z), z = (μ+−μ−)/σ² · (x − (μ++μ−)/2) + ln(π+/π−)  (log-odds เชิงเส้นใน x)
  var DS=[{lab:'Separated',m1:3.0,m0:1.4,s:0.55,pi:0.5},{lab:'Unseparated',m1:2.3,m0:1.6,s:0.6,pi:0.5},{lab:'Imbalanced',m1:2.8,m0:1.4,s:0.55,pi:0.15}];
  var XMIN=0,XMAX=5;
  // ชื่อแท็บ = ลำดับเนื้อหา: ตัดสินจากค่าดิบ x → ตัดสินจากคะแนนแบบจำลอง p̂ → กวาด threshold ทุกค่า (ROC)
  var TABS=[{n:'\\text{Threshold on }x',key:'ex'},{n:'\\text{Threshold on }\\hat p',key:'thr'},{n:'\\text{ROC \\& AUC}',key:'roc'}];
  var EXN=20;   // Example: n คงที่ 20 แถว
  var curTab=0,dsIdx=0;
  var MC='#1e3a8a',Rd='#B0503A',Bl='#3F6E99';
  var TMEM={ex:2.2,p:0.5};   // threshold จำแยก: Example (หน่วย x) · แท็บอื่น (หน่วย p̂)
  function gv(b){return parseFloat(document.getElementById('R'+b).value);}
  function sv(b,v){document.getElementById('R'+b).value=v;document.getElementById('N'+b).value=v;}
  function T(){return TABS[curTab];}
  function isEX(){return T().key==='ex';}

  // ---------- KaTeX static labels ----------
  var MT={'h1':'\\text{Classifier Evaluation}','resample':'\\text{Resample points}',
    'hd-ds':'\\text{Data}','hd-met':'\\text{Metrics}','lbl-n':'n','lbl-t':'t',
    'ds-0':'\\text{Separated}','ds-1':'\\text{Unseparated}','ds-2':'\\text{Imbalanced}',
    'ch-pp':'\\hat y=+','ch-pn':'\\hat y=-','ch-ap':'\\text{actual }+','ch-an':'\\text{actual }-','cs-tp':'\\mathrm{TP}','cs-fn':'\\mathrm{FN}','cs-fp':'\\mathrm{FP}','cs-tn':'\\mathrm{TN}'};
  function K(tex,el){if(!el)return;try{katex.render(tex,el,{throwOnError:false});}catch(e){el.textContent=tex;}}
  function kx(t){try{return window.katex?katex.renderToString(t,{throwOnError:false}):t;}catch(e){return t;}}
  function renderTexts(){if(!window.katex)return;for(var id in MT)K(MT[id],document.getElementById(id));
    K(isEX()?'\\text{Threshold on }x':'\\text{Classification threshold}',document.getElementById('hd-th'));
    K('\\text{metric}',document.getElementById('th-a'));K('\\text{formula}',document.getElementById('th-b'));K('\\text{value}',document.getElementById('th-c'));
    var W=function(t){return '\\textcolor{#fff}{'+t+'}';},hd=isEX()?[W('\\text{PSA }(x)'),W('\\text{actual}'),W('\\text{predicted}')]:[W('\\text{PSA }(x)'),W('\\hat p'),W('\\text{actual}'),W('\\text{predicted}')];   // คำเดียวกับในรูป (actual / predicted)
    document.getElementById('dthead').innerHTML=hd.map(function(t){return '<th>'+kx(t)+'</th>';}).join('');}
  function clLine(name,lc,tc,shape){return '<span class="cli"><i class="'+(shape||'ln')+'" style="background:'+lc+'"></i><span>'+kx('\\textcolor{'+tc+'}{\\text{'+name+'}}')+'</span></span>';}
  // legend: สีเดียวกับ confusion matrix / ตาราง — FN วงแหวนทอง · FP วงแหวนเขียวน้ำทะเล
  function fillLegend(){var el=document.getElementById('classleg');if(!el)return;
    el.innerHTML=clLine('Positive class','#E07A5F',Rd,'ar')+clLine('Negative class','#5B8FB9',Bl,'ar')+clLine('misclassified (✗)','#888','#666');}   // จุด = actual class · พื้นช่อง = ช่อง confusion matrix · ✗ = ผิด

  // ---------- data ----------
  var D={all:[],pos:[],neg:[]};
  function sc(d){return isEX()?d.x:d.p;}   // คะแนนที่ใช้ตัดสิน: Example = x ดิบ · แท็บอื่น = p̂
  function dataset(){var c=DS[dsIdx],n=isEX()?EXN:Math.round(gv('n')),i;D.all=[];D.pos=[];D.neg=[];
    var nP=Math.max(2,Math.round(c.pi*n));   // บังคับให้มีบวกอย่างน้อย 2
    var w=(c.m1-c.m0)/(c.s*c.s),mid=(c.m1+c.m0)/2,b=Math.log(c.pi/(1-c.pi));
    var used={};   // ค่า x ไม่ซ้ำกัน (กริด 0.1): ซ้ำ → ขยับ ±0.1 สลับข้างจนว่าง จุดจึงไม่ทับกัน
    for(i=0;i<n;i++){var y=(i<nP)?1:0,x=Math.round(((y?c.m1:c.m0)+c.s*Z[i])*10)/10,k=0;
      while(used[x.toFixed(1)]&&k<40){k++;x=Math.round((x+(k%2?1:-1)*Math.ceil(k/2)*0.1)*10)/10;}
      x=Math.min(XMAX-0.1,Math.max(XMIN+0.1,x));used[x.toFixed(1)]=1;
      var p=sig(w*(x-mid)+b);D.all.push({x:x,p:p,y:y});}
    D.all.forEach(function(d){(d.y?D.pos:D.neg).push(sc(d));});
    // ช่วงแกน x ของ Example = ช่วงข้อมูล (ปัดครึ่งหน่วย) → แกนไม่กว้างเกิน
    var xs=D.all.map(function(d){return d.x;}),mn=Math.min.apply(null,xs),mx=Math.max.apply(null,xs);
    D.lo=Math.max(XMIN,Math.floor((mn-0.2)*2)/2);D.hi=Math.min(XMAX,Math.ceil((mx+0.2)*2)/2);}
  function confusion(t){var TP=0,FN=0,FP=0,TN=0,i;for(i=0;i<D.pos.length;i++){if(D.pos[i]>=t)TP++;else FN++;}
    for(i=0;i<D.neg.length;i++){if(D.neg[i]>=t)FP++;else TN++;}return {TP:TP,FN:FN,FP:FP,TN:TN};}
  // ROC: กวาด threshold ทุกค่าที่เป็นไปได้ → (FPR,TPR) · AUC = พื้นที่ (trapezoid) = P(p̂+ > p̂−)
  function roc(){var pts=[{f:0,t:0}],P=D.pos.length,N=D.neg.length,arr=D.all.map(function(d){return {s:sc(d),y:d.y};}).sort(function(a,b){return b.s-a.s;}),tp=0,fp=0,i=0;
    while(i<arr.length){var s=arr[i].s;while(i<arr.length&&arr[i].s===s){if(arr[i].y)tp++;else fp++;i++;}pts.push({f:N?fp/N:0,t:P?tp/P:0});}
    var auc=0;for(i=1;i<pts.length;i++)auc+=(pts[i].f-pts[i-1].f)*(pts[i].t+pts[i-1].t)/2;return {pts:pts,auc:auc};}

  // ---------- canvas ----------
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cvr=document.getElementById('cvroc'),ctr=cvr.getContext('2d');
  function prep(c,g){var w=Math.round(c.clientWidth)||600,h=Math.round(c.clientHeight)||200,dpr=window.devicePixelRatio||1;
    c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);return {W:w,H:h};}
  function labs(c){var p=c.parentElement,Ly=p.querySelector('.cvlab');if(!Ly){Ly=document.createElement('div');Ly.className='cvlab';p.appendChild(Ly);}Ly.innerHTML='';
    var ox=c.clientLeft||0,oy=c.clientTop||0;
    return function(tex,x,y,o){o=o||{};var s=document.createElement('span');K(tex,s);if(o.color)s.style.color=o.color;
      if(o.rot){s.style.left=(x+ox)+'px';s.style.top=(y+oy)+'px';s.style.transform='translate(-50%,-50%) rotate(-90deg)';Ly.appendChild(s);return;}   // ป้ายแนวตั้ง จัดกลางที่ (x,y)
      var pr=document.createElement('span');pr.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';s.appendChild(pr);
      s.style.left=(x+ox)+'px';s.style.top='0px';s.style.transform='translateX('+(o.align==='right'?'-100%':o.align==='center'?'-50%':'0')+')';Ly.appendChild(s);
      var sr=s.getBoundingClientRect(),base=pr.getBoundingClientRect().top-sr.top;
      s.style.top=(oy+(o.vt==='middle'?y-sr.height/2:o.vt==='top'?y:y-base))+'px';};}

  // รูปรวมกราฟ + confusion matrix (แบบ MLCC): แกนตั้ง = คะแนน (x หรือ p̂) · คอลัมน์ซ้าย = actual + · ขวา = actual − ·
  // เส้นประ threshold แบ่งแถว ŷ=+ (บน) / ŷ=− (ล่าง) → 4 ช่อง = TP | FP บน, FN | TN ล่าง สีพื้นและสีจุดตามผล · นับในมุมช่อง
  function drawStrip(t,C){var sz=prep(cv,ctx),W=sz.W,H=sz.H,g=ctx,lb=labs(cv);
    var L=56,Rm=12,TOP=28,BOT=20,pw=W-L-Rm,ph=H-TOP-BOT;   // ป้ายแถว (predicted ±) + tick อยู่ขอบซ้ายทั้งคู่ → ขอบขวาแคบ พื้นที่วาดกว้างขึ้น
    var lo=isEX()?D.lo:0,hi=isEX()?D.hi:1,dec=isEX()?1:2,tick=isEX()?0.5:0.25,tdec=isEX()?1:2;
    function py(s){return TOP+ph-(s-lo)/(hi-lo)*ph;}
    var xm=L+pw/2,yT=py(t),xL=L+pw/4,xR=L+3*pw/4;
    g.fillStyle='#FBE9E4';g.fillRect(L,TOP,pw/2,yT-TOP);g.fillStyle='#E3F1EE';g.fillRect(xm,TOP,pw/2,yT-TOP);
    g.fillStyle='#FAEFD6';g.fillRect(L,yT,pw/2,TOP+ph-yT);g.fillStyle='#E9F0F8';g.fillRect(xm,yT,pw/2,TOP+ph-yT);
    g.strokeStyle='rgba(128,128,128,0.6)';g.lineWidth=1;g.strokeRect(L,TOP,pw,ph);g.beginPath();g.moveTo(xm,TOP);g.lineTo(xm,TOP+ph);g.stroke();
    // แกนคะแนน (ซ้าย) — ข้าม tick ที่ชนป้าย threshold
    g.fillStyle='rgba(128,128,128,0.9)';g.font='13px KaTeX_Main,serif';g.textAlign='right';g.textBaseline='middle';
    for(var a=lo;a<=hi+1e-9;a+=tick){var yy=py(a);if(Math.abs(yy-yT)>14)g.fillText(a.toFixed(tdec),L-7,yy);}
    // threshold
    g.strokeStyle='#111';g.setLineDash([5,4]);g.lineWidth=1.8;g.beginPath();g.moveTo(L-4,yT);g.lineTo(L+pw+4,yT);g.stroke();g.setLineDash([]);
    g.fillStyle='#111';g.font='13px KaTeX_Main,serif';g.textAlign='right';g.fillText(t.toFixed(dec),L-7,yT);g.textBaseline='alphabetic';
    // จุด: beeswarm ต่อคอลัมน์ (ชนกันในแนวตั้ง → ขยับซ้าย/ขวาสลับกัน) สีตามผล TP coral · FN ทอง · FP เขียวน้ำทะเล · TN ฟ้า
    var r=D.all.length<=20?6:5,gap=2*r+1.5;
    // dot histogram แนวตั้ง: จุดเข้าช่องสูง gap โดยวัดจากเส้น threshold (ขอบช่องตรงกับเส้น → ไม่มีจุดคร่อมเส้น) แล้วเรียงเป็นแถวออกจากกลางคอลัมน์
    function swarm(vals,cx,pos){var bins={};vals.forEach(function(s){var y=py(s),up=y<yT,idx=Math.floor((up?yT-y:y-yT)/gap),key=(up?'u':'d')+idx;(bins[key]=bins[key]||{up:up,idx:idx,v:[]}).v.push(s);});
      Object.keys(bins).forEach(function(key){var b=bins[key],yc=b.up?yT-(b.idx+0.5)*gap:yT+(b.idx+0.5)*gap;
        b.v.forEach(function(s,j){var x=cx+Math.ceil(j/2)*(j%2?1:-1)*gap,miss=pos?(s<t):(s>=t);
          g.fillStyle=pos?'#E07A5F':'#5B8FB9';g.beginPath();g.arc(x,yc,r,0,7);g.fill();   // สีจุด = actual class · พื้นช่อง = predicted
          if(miss){var q=r*0.55;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(x-q,yc-q);g.lineTo(x+q,yc+q);g.moveTo(x+q,yc-q);g.lineTo(x-q,yc+q);g.stroke();}});});}   // ✗ = ทำนายผิด
    g.save();g.beginPath();g.rect(L,TOP,pw,ph);g.clip();swarm(D.pos,xL,true);swarm(D.neg,xR,false);g.restore();   // จุดไม่ล้นกรอบ
    // นับในมุมของแต่ละช่อง (ตัวเลขใหญ่ + ชื่อช่อง)
    // ตัวเลข + ชื่อช่องบรรทัดเดียว ที่มุมกรอบคงที่ (ไม่ล้นกรอบแม้ threshold สุดขอบ)
    function cnt(v,lab,x,y,al,col,big){var fs=(big?21:15)+'px KaTeX_Main,serif';g.fillStyle=col;g.font=fs;var wv=g.measureText(String(v)).width;g.font='13px KaTeX_Main,serif';var wl=g.measureText(lab).width;
      var x0=al==='left'?x:x-(wv+6+wl);g.textAlign='left';g.font=fs;g.fillText(String(v),x0,y);g.font='13px KaTeX_Main,serif';g.fillText(lab,x0+wv+6,y);}
    // แถวบางกว่า 34px (threshold ใกล้สุดขอบ) → ย้ายป้ายนับออกนอกกรอบ (เหนือ/ใต้) ตัวเล็กลง ไม่ทับเส้น/จุด
    var thinA=(yT-TOP)<34,thinB=(TOP+ph-yT)<34,yA=thinA?TOP-9:TOP+24,yB=thinB?TOP+ph+15:TOP+ph-10;
    cnt(C.TP,'TP',L+8,yA,'left','#8A3B2C',!thinA);cnt(C.FP,'FP',L+pw-8,yA,'right','#2E7D70',!thinA);
    cnt(C.FN,'FN',L+8,yB,'left','#8A6510',!thinB);cnt(C.TN,'TN',L+pw-8,yB,'right','#3F6E99',!thinB);
    // หัวคอลัมน์ (actual) + ป้ายแถว (ŷ) แนวตั้งด้านขวา
    lb('\\text{actual }+',xL,TOP-9,{align:'center'});lb('\\text{actual }-',xR,TOP-9,{align:'center'});
    if(!thinA)lb('\\text{predicted }+',L-46,(TOP+yT)/2,{rot:true});if(!thinB)lb('\\text{predicted }-',L-46,(yT+TOP+ph)/2,{rot:true});}   // ป้ายแถวแนวตั้งซ้ายสุด · แถวบาง → ไม่ใส่

  function drawRoc(t,R){var sz=prep(cvr,ctr),W=sz.W,H=sz.H,g=ctr;
    var L=48,Rm=14,TOP=14,BOT=34,pw=W-L-Rm,ph=H-TOP-BOT,i;   // L กว้างพอให้ป้าย TPR (แนวตั้ง) ไม่ชิดขอบและไม่ทับ tick
    function px(f){return L+f*pw;} function py(v){return TOP+ph-v*ph;}
    g.strokeStyle='rgba(128,128,128,0.25)';g.lineWidth=1;[0.25,0.5,0.75].forEach(function(v){g.beginPath();g.moveTo(px(v),py(0));g.lineTo(px(v),py(1));g.moveTo(px(0),py(v));g.lineTo(px(1),py(v));g.stroke();});
    g.strokeStyle='rgba(128,128,128,0.6)';g.strokeRect(px(0),py(1),pw,ph);
    g.fillStyle='rgba(128,128,128,0.9)';g.font='13px KaTeX_Main,serif';g.textAlign='center';g.textBaseline='alphabetic';
    [0,0.5,1].forEach(function(v){g.fillText(v.toFixed(1),px(v),py(0)+15);});g.textAlign='right';g.textBaseline='middle';[0,0.5,1].forEach(function(v){g.fillText(v.toFixed(1),px(0)-5,py(v));});g.textBaseline='alphabetic';
    g.strokeStyle='rgba(17,17,17,0.45)';g.setLineDash([5,4]);g.beginPath();g.moveTo(px(0),py(0));g.lineTo(px(1),py(1));g.stroke();g.setLineDash([]);
    var P=R.pts;g.fillStyle='rgba(30,58,138,0.10)';g.beginPath();g.moveTo(px(0),py(0));for(i=0;i<P.length;i++)g.lineTo(px(P[i].f),py(P[i].t));g.lineTo(px(1),py(0));g.closePath();g.fill();
    g.strokeStyle=MC;g.lineWidth=2.2;g.beginPath();for(i=0;i<P.length;i++){i?g.lineTo(px(P[i].f),py(P[i].t)):g.moveTo(px(P[i].f),py(P[i].t));}g.stroke();
    var C=confusion(t),tpr=D.pos.length?C.TP/D.pos.length:0,fpr=D.neg.length?C.FP/D.neg.length:0;
    g.fillStyle=MC;g.beginPath();g.arc(px(fpr),py(tpr),5.5,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
    // ป้าย threshold ข้างจุด: อยู่ในกรอบเสมอ ไม่ทับป้าย AUC (มุมขวาล่าง)
    g.fillStyle='#111';g.font='13px KaTeX_Main,serif';g.textAlign='left';var tl='threshold '+t.toFixed(2),wl=g.measureText(tl).width,lx=px(fpr)+10;
    if(lx+wl>L+pw)lx=px(fpr)-10-wl;if(lx<L)lx=L;var ly=(tpr>0.85)?py(tpr)+16:py(tpr)-8;
    if(ly>py(0.18)&&lx+wl>px(0.5))ly=py(tpr)-8;if(ly-12<TOP)ly=py(tpr)+16;
    g.fillText(tl,lx,ly);
    g.fillStyle='rgba(90,90,90,0.9)';g.textAlign='center';g.fillText('FPR',px(0.5),H-5);
    g.save();g.translate(16,py(0.5));g.rotate(-Math.PI/2);g.fillText('TPR',0,0);g.restore();   // baseline ที่ x=16 → ตัวอักษรอยู่ช่วง 5–16 ไม่ชิดขอบ
    var lb=labs(cvr);lb('\\text{AUC}='+R.auc.toFixed(2),px(0.97),py(0.06),{align:'right',color:MC});}

  // ---------- ตารางข้อมูล (ซ้าย): x | (p̂) | y | ŷ เรียงตามคะแนนมากไปน้อย · สีแถว = ผล TP/FN/FP/TN ----------
  function fillDtab(t){var tb=document.getElementById('dtbody');if(!tb)return;var arr=D.all.slice().sort(function(a,b){return sc(b)-sc(a);}),h='';
    function cls(y){return y?'\\textcolor{'+Rd+'}{+}':'\\textcolor{'+Bl+'}{-}';}
    var cut=-1;arr.forEach(function(d,i){var yh=sc(d)>=t?1:0,k=d.y?(yh?'tp':'fn'):(yh?'fp':'tn');if(!yh&&cut<0)cut=i;   // แถวแรกที่อยู่ใต้ threshold
      h+='<tr class="'+k+(cut===i?' cut':'')+'"><td>'+kx(d.x.toFixed(1))+'</td>'+(isEX()?'':'<td>'+kx(d.p.toFixed(2))+'</td>')+'<td>'+kx(cls(d.y))+'</td><td>'+kx(cls(yh))+'</td></tr>';});
    tb.innerHTML=h;}

  // ---------- confusion + ตารางสูตร ----------
  function fillCM(C){K(String(C.TP),document.getElementById('c-tp'));K(String(C.FN),document.getElementById('c-fn'));K(String(C.FP),document.getElementById('c-fp'));K(String(C.TN),document.getElementById('c-tn'));}
  // ตารางใต้ control: metric | สูตร (\frac เล็ก) | ค่าแทนเลข = ทศนิยม 2 ตำแหน่ง
  function fr(num,den){return '\\frac{'+num+'}{'+den+'}';}
  // สีในสมการ = สีช่อง TP / FN / FP / TN (ทั้งสัญลักษณ์และตัวเลขที่แทนค่า)
  var CC={TP:'#8A3B2C',FN:'#8A6510',FP:'#2E7D70',TN:'#3F6E99'};
  function cs(k){return '\\textcolor{'+CC[k]+'}{\\mathrm{'+k+'}}';} function cn(k,v){return '\\textcolor{'+CC[k]+'}{'+v+'}';}
  function vv(ns,ds,nv,dv){return dv>0?fr(ns,ds)+'='+(nv/dv).toFixed(2):'\\text{--}';}
  function fillTable(C,R){var k=T().key,rows=[],TP=C.TP,FN=C.FN,FP=C.FP,TN=C.TN,n=TP+FN+FP+TN;
    var tp=cn('TP',TP),fn=cn('FN',FN),fp=cn('FP',FP),tn=cn('TN',TN);
    if(k==='thr'||k==='ex'){
      rows=[['\\text{accuracy}',fr(cs('TP')+'+'+cs('TN'),'n'),vv(tp+'+'+tn,n,TP+TN,n)],
            ['\\text{recall (TPR)}',fr(cs('TP'),cs('TP')+'+'+cs('FN')),vv(tp,tp+'+'+fn,TP,TP+FN)],
            ['\\text{FPR}',fr(cs('FP'),cs('FP')+'+'+cs('TN')),vv(fp,fp+'+'+tn,FP,FP+TN)],
            ['\\text{precision}',fr(cs('TP'),cs('TP')+'+'+cs('FP')),vv(tp,tp+'+'+fp,TP,TP+FP)],
            ['F_1',fr('2'+cs('TP'),'2'+cs('TP')+'+'+cs('FP')+'+'+cs('FN')),vv('2\\cdot'+tp,'2\\cdot'+tp+'+'+fp+'+'+fn,2*TP,2*TP+FP+FN)]];}
    else if(k==='roc'){
      rows=[['\\text{TPR}',fr(cs('TP'),cs('TP')+'+'+cs('FN')),vv(tp,tp+'+'+fn,TP,TP+FN)],
            ['\\text{FPR}',fr(cs('FP'),cs('FP')+'+'+cs('TN')),vv(fp,fp+'+'+tn,FP,FP+TN)],
            ['\\text{AUC}','P(\\hat p_+>\\hat p_-)',R.auc.toFixed(2)]];}
    var h='';rows.forEach(function(r){h+='<tr><td>'+kx(r[0])+'</td><td>'+kx(r[1])+'</td><td>'+kx(r[2])+'</td></tr>';});
    document.getElementById('mbody').innerHTML=h;}

  function upd(){var t=gv('t'),C=confusion(t),R=roc(),k=T().key;
    document.querySelector('.main').className='main'+(k==='roc'?' roc':'');
    document.getElementById('stage').className='stage'+(isEX()?'':' wide');
    document.getElementById('row-n').style.display=isEX()?'none':'';
    var gm=document.getElementById('grp-met');gm.style.display='';   // metric ทุกแท็บ: ex/thr ใต้กราฟ · roc ในแผงควบคุม (ใต้กราฟมี ROC แล้ว)
    var host=(k==='roc')?document.querySelector('.panel'):document.querySelector('.main');if(gm.parentElement!==host)host.appendChild(gm);
    drawStrip(t,C);if(k==='roc')drawRoc(t,R);fillTable(C,R);fillLegend();fillDtab(t);}

  // ---------- controls ----------
  function setDsSeg(){var bs=document.querySelectorAll('#dsSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(parseInt(bs[i].getAttribute('data-ds'),10)===dsIdx)?'on':'';}
  // ช่วง threshold: Example = ช่วงข้อมูล (D.lo–D.hi) · p̂ = 0.05–0.95 (สุดขอบกว่านี้ทุกจุดถูกทำนายเหมือนกันหมด)
  function setTRange(){var e=isEX(),lo=e?D.lo:0,hi=e?D.hi:1;/* p̂: 0–1 รวมปลายทั้งสอง */['Rt','Nt'].forEach(function(id){var el=document.getElementById(id);el.min=lo;el.max=hi;el.step=e?0.1:0.01;});
    if(e){TMEM.ex=Math.min(hi,Math.max(lo,TMEM.ex));sv('t',TMEM.ex.toFixed(1));}else{TMEM.p=Math.min(hi,Math.max(lo,TMEM.p));sv('t',TMEM.p.toFixed(2));}}
  function applyTab(k){curTab=k;var btns=document.querySelectorAll('.tabbtn');for(var i=0;i<btns.length;i++)btns[i].className='tabbtn'+(i===k?' on':'');renderTexts();dataset();setTRange();upd();}
  var tb=document.getElementById('tabs');
  TABS.forEach(function(t,i){var el=document.createElement('button');el.className='tabbtn';K(t.n,el);el.addEventListener('click',function(){applyTab(i);});tb.appendChild(el);});
  ['n','t'].forEach(function(b){var Re=document.getElementById('R'+b),Ne=document.getElementById('N'+b);
    function after(){if(b==='t'){if(isEX())TMEM.ex=gv('t');else TMEM.p=gv('t');}if(b==='n'){dataset();setTRange();}upd();}
    Re.addEventListener('input',function(){Ne.value=(b==='t')?parseFloat(Re.value).toFixed(isEX()?1:2):Re.value;after();});
    Ne.addEventListener('input',function(){Re.value=Ne.value;after();});});
  document.querySelectorAll('#dsSeg button').forEach(function(b){b.addEventListener('click',function(){dsIdx=parseInt(b.getAttribute('data-ds'),10);setDsSeg();dataset();setTRange();upd();});});
  document.getElementById('resample').addEventListener('click',function(){seed=(seed*1664525+1013904223)>>>0;regen(seed);dataset();setTRange();upd();});
  window.addEventListener('resize',function(){upd();});

  renderTexts();setDsSeg();applyTab(0);
  requestAnimationFrame(function(){renderTexts();upd();});
  setTimeout(function(){renderTexts();upd();},300);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){upd();});
})();
</script>
