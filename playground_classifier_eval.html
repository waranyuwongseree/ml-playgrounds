<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classification Metrics</title>
<link rel="stylesheet" href="pg_style.css?v=24">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="day4_data.js"></script>
<style>
  /* classifier-evaluation — 3 แท็บตาม MLCC (Example · Threshold & metrics · ROC & AUC)
     ทุกแท็บ layout เดียวกัน: ตารางข้อมูลซ้าย · ขวา = กราฟ → confusion matrix → ตารางสูตร (แบบ Introduction to Classification)
     Example = ค่าดิบ x (PSA) กับ threshold บน x · แท็บอื่น = แบบจำลองให้ p̂ จาก x แล้ว threshold บน p̂
     โครง/ฟอนต์ = .distcls กลาง (เหมือน 1-D Bayes) · ตาราง = .mtab กลาง 15px */
  /* หน้าจอไม่พอ → เลื่อนทั้งหน้าได้ (ตารางข้อมูลแสดงครบทุกแถว) · แผงควบคุมตรึงบนขณะเลื่อน */
  html,body.pg{height:auto;overflow:auto}
  html{scrollbar-gutter:stable}   /* เผื่อที่ scrollbar เสมอ → ความกว้างหน้าเท่ากันทุกแท็บ ไม่ขยับเมื่อแท็บใดยาวกว่า */
  .pg .wrap{height:auto;max-height:none;overflow:visible}
  .pg .layout>.panel{position:sticky;top:10px}
  .layout{align-items:start}
  .distcls .stage{flex-direction:row;gap:18px;align-items:flex-start}
  .stage .main{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-width:0}
  /* ตารางข้อมูล (ซ้าย): x | (p̂) | y | ŷ — สีแถวตามผล TP/FN/FP/TN เท่ากับ confusion matrix */
  .exleft{flex:0 0 250px;min-width:0;border-radius:8px;align-self:flex-start;position:relative;max-height:calc(100vh - 84px);overflow-y:auto;scrollbar-width:thin}   /* กว้างเท่ากันทุกแท็บ · n > 20 → เลื่อนในตาราง (หัวตรึง) หน้าไม่ scroll */
  .dtab thead th{position:sticky;top:0;z-index:1}
  .stage.wide .exleft{flex-basis:250px}
  .dtab{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
  .dtab th{background:var(--navy);color:#fff;font-weight:400;padding:5px 6px;text-align:center}
  .dtab td{padding:1px 6px;text-align:center;color:var(--ink);line-height:1.35;background:#fff}
  .dtab tr.tp td{background:#FBE9E4}.dtab tr.fn td{background:#FAEFD6}.dtab tr.fp td{background:#E3F1EE}.dtab tr.tn td{background:#E9F0F8}
  .dtab tr.cut td{border-top:2px dashed #111}   /* เส้นประ threshold ในตาราง: เหนือแถวแรกที่อยู่ใต้ threshold (predicted −) */
  .dtab .katex{font-size:1em}
  /* รูปรวม (score × actual class) = จัตุรัส 280 เท่ากันทุกแท็บ · แท็บ ROC: กราฟ ROC จัตุรัสขนาดเดียวกันวางข้าง → พอดี 1 หน้า */
  /* รูปรวมจัตุรัส 300 เท่ากันทุกแท็บ · แท็บ ROC: กราฟ ROC จัตุรัสขนาดเดียวกัน วางใต้ (บน–ล่าง) → 64+300+30+300 พอดี 1 หน้า */
  /* ขนาดจัตุรัสตามความสูงจอ: (100vh − หัว/legend/ช่องว่าง 190px) ÷ 2 อยู่ระหว่าง 200–300 → รูป + ROC ซ้อนกันพอดี 1 หน้าทุกจอ */
  /* สูงของแต่ละรูป = (100vh − หัว 64 − ช่องว่าง) ÷ 2 → รูปรวม + ROC ซ้อนกันเต็มจอพอดี · กว้างเต็มคอลัมน์ (legend ย้ายไปแผงควบคุม) */
  :root{--sq:clamp(220px,calc((100vh - 122px)/2),360px)}   /* หัว 64 + legend 30 + ช่องว่าง → รูปรวม + ROC ซ้อนกันพอดี */
  /* ตาราง metric: แท็บ Example / Threshold & metrics อยู่ใต้กราฟ (การ์ดขาว) · แท็บ ROC อยู่ในแผงควบคุม */
  .main #grp-met{margin-top:0;border-top:0;padding:8px 14px 6px;background:#fff;border:1px solid var(--line);border-radius:12px}
  .main #grp-met .mtab,.main #grp-met .mtab th,.main #grp-met .mtab td{font-size:15px}
  .pg.distcls .canvasbox{flex:1 1 auto;width:100%;height:var(--sq)}
  /* แท็บที่มีตาราง metric 7 แถวใต้กราฟ: สูงของรูป = ที่เหลือจากหัว + legend + ตาราง (≈410px) → ยังพอดี 1 หน้า */
  .pg.distcls .main:not(.roc) .canvasbox{height:clamp(200px,calc(100vh - 306px),400px)}
  .toprow{display:flex;gap:16px;align-items:center}
  .toprow .canvasbox{margin:0}
  .rocbox{display:none;width:100%;height:var(--sq);box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;position:relative}
  .panel .classleg{margin-top:8px;flex-wrap:wrap}
  /* AUC คิดมือ (แท็บ ROC): ชิ้นสมการตัดบรรทัดระหว่างชิ้นได้ */
  #aucnote{font-size:14px;line-height:1.5;margin-top:6px}
  #aucnote .ln{display:block;margin:4px 0}
  #aucnote .ln>span{display:inline-block;margin-right:.25em;vertical-align:middle}
  #aucnote .katex{font-size:1em}
  .main.roc .rocbox{display:block}
  .rocbox canvas{width:100%;height:100%;display:block}
  .toprow.roc .rocbox{display:block}
  /* ตาราง metric อยู่ใต้ control (ไม่กินพื้นที่คอลัมน์กราฟ) — \frac เล็ก ทศนิยม 2 ตำแหน่ง */
  #grp-met{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  .panel .mtab{width:100%;font-size:15px}
  .panel .mtab th,.panel .mtab td{padding:3px 6px;font-size:15px}
  .cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:15px;width:100%;align-items:center}
  .cm .hh{display:flex;align-items:center;justify-content:center;color:#555;font-size:17px;padding:2px 6px;text-align:center;white-space:nowrap}
  .cm .cell{border-radius:12px;padding:6px 8px;text-align:center}.cm .cell b{font-size:21px;display:block;font-variant-numeric:tabular-nums;font-weight:400}.cm .cell span{font-size:15px}
  .cm .katex{font-size:1em}
  .tp{background:#FBE9E4;color:#8A3B2C}.fn{background:#FAEFD6;color:#8A6510}.fp{background:#E3F1EE;color:#2E7D70}.tn{background:#E9F0F8;color:#3F6E99}
  .tblbox{width:100%;min-width:0}
  .pg .mtab{margin:0}
  .pg .mtab th,.pg .mtab td{padding:3px 10px;font-size:15px;vertical-align:middle;line-height:1.4}
  .pg .mtab th{white-space:normal}
  .pg .mtab th.r{text-align:right;white-space:nowrap}
  /* แถบ metric 2 คอลัมน์ (แบบ 1-D Bayes) — การ์ดขาว */
  .mbarsbox{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .distcls .mbarsbox .mbar .nm{font-size:13px}.mbarsbox .katex{font-size:1em}
  .distcls .mbarsbox .mbar .nm .lab{white-space:nowrap}
  .distcls .mbarsbox .mcol:first-child{flex:1.1}   /* คอลัมน์ซ้ายสูตรยาวกว่า */
  .mbarsbox .trow{display:flex;align-items:center;gap:6px}.mbarsbox .trow .track{flex:1}
  .mbarsbox .trow .tr{flex:none;white-space:nowrap;text-align:right;font-size:11.5px;color:#6b7280;line-height:1}
  /* หัวตาราง metric: พื้นกรมท่า ตัวขาว เหมือนหัวตารางข้อมูลด้านซ้าย → แยกจากแถวเนื้อหาชัดเจน */
  .pg .mtab thead th{background:var(--navy);color:#fff;font-weight:400;border-bottom:none;padding-top:5px;padding-bottom:5px}
  .pg .mtab thead th:first-child{border-top-left-radius:6px}.pg .mtab thead th:last-child{border-top-right-radius:6px}
  .pg .mtab td.r{text-align:right;white-space:nowrap}
  .pg .mtab td{font-weight:400;color:var(--ink);font-variant-numeric:normal;text-align:left}
  .pg .mtab td:first-child{white-space:nowrap}
  .pg .mtab td .katex{white-space:nowrap}
  .pg .mtab td:last-child{text-align:right;white-space:nowrap}
  .pg .mtab th .katex,.pg .mtab td .katex{font-size:1em;line-height:1.2;vertical-align:baseline}
  .pg .mtab th.r .katex,.pg .mtab td:last-child .katex{display:block;text-align:right}
  .pg .mtab th.r .katex-html,.pg .mtab td:last-child .katex-html{display:inline-block}
  .canvasbox,.rocbox{position:relative}
  .cvlab{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;font-size:13px;line-height:1}
  .cvlab>span{position:absolute;white-space:nowrap;color:rgba(90,90,90,0.9)}
  .cvlab .katex{font-size:1em}
  .seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .seg2 button{flex:1 1 auto;font:inherit;font-size:14px;padding:6px 8px;border:0;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
  .seg2 button.on{background:var(--navy);color:#fff}
  .seg2 .katex{font-size:1em}
  .tgls{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  @media(max-width:820px){.distcls .stage{flex-direction:column}.exleft,.stage.wide .exleft{flex:none;width:100%}.pg .layout>.panel{position:static}}
</style>
</head>
<body class="pg distcls">
<div class="wrap">
  <div class="hdr"><h1 id="h1">Classification Metrics</h1><div class="tabs" id="tabs"></div></div>

  <div class="layout" id="mainPanel">
    <div class="stage" id="stage">
      <div class="exleft" id="exleft"><table class="dtab" id="dtab"><thead><tr id="dthead"></tr></thead><tbody id="dtbody"></tbody></table></div>
      <div class="main">
      <!-- กราฟ + confusion matrix รวมเป็นรูปเดียว (แบบ MLCC): แกนตั้ง = คะแนน · คอลัมน์ = actual +/− · เส้น threshold แบ่งแถว ŷ · นับในแต่ละช่อง -->
      <div class="toprow" id="toprow">
        <div class="canvasbox"><canvas id="cv"></canvas></div>
      </div>
      <div class="classleg" id="classleg"></div>
      <div class="rocbox" id="rocbox"><canvas id="cvroc"></canvas></div>
      <!-- #grp-met (ตาราง metric) ถูกย้ายมาไว้ตรงนี้ด้วย JS ในแท็บ Example / Threshold & metrics · แท็บ ROC อยู่ในแผงควบคุม -->
      </div>
    </div>

    <!-- CONTROL -->
    <div class="panel">
      <div id="grp-ds"><div class="dhd" id="hd-ds"></div>
      <div class="seg2" id="dsSeg"><button data-ds="0" id="ds-0" class="on"></button><button data-ds="1" id="ds-1"></button><button data-ds="2" id="ds-2"></button></div>
      <div class="dgrid">
        <div class="drow" id="row-n"><span class="dlab" id="lbl-n"></span><input type="range" id="Rn" min="10" max="40" step="2" value="20"><input class="num" type="number" id="Nn" min="10" max="40" step="2" value="20"></div>
      </div></div>
      <div id="grp-th"><div class="dhd" id="hd-th"></div>
      <!-- คะแนนที่ใช้ตัดสิน: ค่าดิบ x หรือความน่าจะเป็นจากแบบจำลอง p̂ (ชุดข้อมูลเดียวกัน · threshold แปลงตามกัน → confusion matrix เท่าเดิม) -->
      <div class="seg2" id="scSeg"><button data-sc="x" id="sc-x" class="on"></button><button data-sc="p" id="sc-p"></button></div>
      <div class="dgrid">
        <div class="drow" id="row-t"><span class="dlab" id="lbl-t"></span><input type="range" id="Rt" min="0.5" max="4.5" step="0.1" value="2.2"><input class="num" type="number" id="Nt" min="0.5" max="4.5" step="0.1" value="2.2"></div>
      </div></div>
      <div id="grp-rs" class="tgls"><button class="primary" id="resample" style="width:100%"></button></div>
      <div id="grp-met">
      <div class="mbarsbox" id="mbars"></div>
      <div class="tblbox"><table class="mtab" id="mtab">
        <thead><tr><th id="th-a"></th><th id="th-b"></th><th class="r" id="th-c"></th></tr></thead>
        <tbody id="mbody"></tbody>
      </table></div>
      <div id="aucnote"></div></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---------- rng ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var MAXN=400,Z=[],PF=[],PG=[];   // PF/PG = ดัชนีสุ่มของชั่วโมง fault / healthy ที่จะหยิบมาเป็นตัวอย่าง
  function regen(seed){var rng=mulberry32(seed),i;function g(){var u=rng()||1e-9,v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
    Z=[];PF=[];PG=[];for(i=0;i<MAXN;i++){Z.push(g());PF.push(Math.floor(rng()*1e6));PG.push(Math.floor(rng()*1e6));}}
  var seed=20260916;regen(seed);
  function sig(z){return 1/(1+Math.exp(-z));}

  // ---------- datasets (MLCC: Separated · Unseparated · Imbalanced) บนค่าดิบ x = อุณหภูมิแบริ่งของปั๊ม (predictive maintenance) ----------
  // d = สัดส่วนการเลื่อนของชั่วโมง fault (1 = ข้อมูลจริง) · pi = สัดส่วนบวกในตัวอย่าง — รายละเอียดใน dataset()
  var DS=[{lab:'Separated',d:1.0,pi:0.5},{lab:'Unseparated',d:0.45,pi:0.5},{lab:'Imbalanced',d:1.0,pi:0.15}];
  // ถอดรหัส day4_data.js (เหมือน Introduction to Classification)
  var D4IDX=(function(){var a=new Int32Array(128);if(typeof D4A64!=='undefined')for(var i=0;i<D4A64.length;i++)a[D4A64.charCodeAt(i)]=i;return a;})(),_cache={};
  function dcol(c,n){var out=new Float64Array(n),w=c.w,b=c.b,sc=Math.pow(10,c.dp);
    for(var i=0;i<n;i++){var x=0,o=i*w;for(var j=0;j<w;j++)x=x*64+D4IDX[b.charCodeAt(o+j)];out[i]=(x+c.lo)/sc;}return out;}
  function SET(name){if(_cache[name])return _cache[name];if(typeof D4RAW==='undefined'||!D4RAW[name])return null;
    var raw=D4RAW[name],n=raw.n,col={};Object.keys(raw.col).forEach(function(k){col[k]=dcol(raw.col[k],n);});
    var bad=new Uint8Array(n);for(var i=0;i<n;i++)bad[i]=(raw.truth.charCodeAt(i)===49)?1:0;
    return(_cache[name]={name:name,n:n,col:col,bad:bad});}
  // ชื่อแท็บ = ลำดับเนื้อหา: ตัดสินจากค่าดิบ x → ตัดสินจากคะแนนแบบจำลอง p̂ → กวาด threshold ทุกค่า (ROC)
  // แท็บ 1 รวม "ตัดที่ x" กับ "ตัดที่ p̂" ไว้ด้วยกัน — สลับด้วยปุ่ม Score (scMode) · แท็บ ROC ใช้ p̂ เสมอ
  var TABS=[{n:'\\text{Threshold \\& Metrics}',key:'thr'},{n:'\\text{ROC \\& AUC}',key:'roc'}];
  var curTab=0,dsIdx=0,scMode='x';
  var MC='#1e3a8a',Rd='#B0503A',Bl='#3F6E99';
  var TMEM={ex:null,p:0.5,src:'p'};   // เริ่มที่ p̂ = 0.5 (x เริ่มที่ค่าเทียบเท่า)   // src = แกนที่ผู้ใช้ตั้ง threshold ล่าสุด (อีกแกนคำนวณตาม — ดู matchT)   // threshold จำแยก: Threshold on x (หน่วย °C, เริ่มที่กึ่งกลางช่วงข้อมูล) · แท็บอื่น (หน่วย p̂)
  function gv(b){return parseFloat(document.getElementById('R'+b).value);}
  function sv(b,v){document.getElementById('R'+b).value=v;document.getElementById('N'+b).value=v;}
  function T(){return TABS[curTab];}
  function isEX(){return T().key==='thr'&&scMode==='x';}   // true = คะแนนที่ใช้ตัดสินคือค่าดิบ x

  // ---------- KaTeX static labels ----------
  var MT={'h1':'\\text{Classification Metrics}','resample':'\\text{Resample points}',
    'hd-ds':'\\text{Data (pump bearing temperature)}','lbl-n':'n','lbl-t':'t',
    'sc-x':'\\text{raw value }x','sc-p':'\\text{model probability }\\hat p',
    'ds-0':'\\text{Separated}','ds-1':'\\text{Unseparated}','ds-2':'\\text{Imbalanced}',
    'ch-pp':'\\hat y=+','ch-pn':'\\hat y=-','ch-ap':'\\text{actual }+','ch-an':'\\text{actual }-','cs-tp':'\\mathrm{TP}','cs-fn':'\\mathrm{FN}','cs-fp':'\\mathrm{FP}','cs-tn':'\\mathrm{TN}'};
  function K(tex,el){if(!el)return;try{katex.render(tex,el,{throwOnError:false});}catch(e){el.textContent=tex;}}
  function kx(t){try{return window.katex?katex.renderToString(t,{throwOnError:false}):t;}catch(e){return t;}}
  function renderTexts(){if(!window.katex)return;for(var id in MT)K(MT[id],document.getElementById(id));
    K(T().key==='roc'?'\\text{Classification threshold on }\\hat p':'\\text{Classification threshold on}',document.getElementById('hd-th'));
    K('\\text{metric}',document.getElementById('th-a'));K('\\text{formula}',document.getElementById('th-b'));K('\\text{value}',document.getElementById('th-c'));
    // หัวตาราง: temp (x) = อุณหภูมิแบริ่ง °C · แท็บ ROC เพิ่ม TPR/FPR "ถ้าตั้ง threshold ที่แถวนี้" (แทนคอลัมน์ predicted)
    var W=function(t){return '\\textcolor{#fff}{'+t+'}';},k=T().key,X=W('\\text{temp }(x)');
    var hd=isEX()?[X,W('\\text{actual}'),W('\\text{predicted}')]:k==='thr'?[X,W('\\hat p'),W('\\text{actual}'),W('\\text{predicted}')]:[X,W('\\hat p'),W('\\text{actual}'),W('\\text{TPR}'),W('\\text{FPR}')];
    document.getElementById('dthead').innerHTML=hd.map(function(t){return '<th>'+kx(t)+'</th>';}).join('');}
  function clLine(name,lc,tc,shape){return '<span class="cli"><i class="'+(shape||'ln')+'" style="background:'+lc+'"></i><span>'+kx('\\textcolor{'+tc+'}{\\text{'+name+'}}')+'</span></span>';}
  // legend: สีเดียวกับ confusion matrix / ตาราง — FN วงแหวนทอง · FP วงแหวนเขียวน้ำทะเล
  function fillLegend(){var el=document.getElementById('classleg');if(!el)return;
    el.innerHTML=clLine('Positive class','#E07A5F',Rd,'ar')+clLine('Negative class','#5B8FB9',Bl,'ar')+clLine('misclassified (✗)','#888','#666');}   // จุด = actual class · พื้นช่อง = ช่อง confusion matrix · ✗ = ผิด

  // ---------- data ----------
  var D={all:[],pos:[],neg:[]};
  function sc(d){return isEX()?d.x:d.p;}   // คะแนนที่ใช้ตัดสิน: Example = x ดิบ · แท็บอื่น = p̂
  // ข้อมูล = ชั่วโมงจริงของปั๊ม (day4: along_the_model) · x = อุณหภูมิแบริ่ง (°C) · บวก = ชั่วโมงที่มี fault
  //   δ = สัดส่วนการเลื่อนของชั่วโมง fault ออกจากค่าเฉลี่ยชั่วโมงปกติ (1 = ข้อมูลจริง · เล็กลง = ซ้อนทับมากขึ้น) · π = สัดส่วนบวกในตัวอย่าง

      var tR=isEX()?matchT(false,0.5):0.5,C0=confusion(tR);
      var mets=function(c){var m=c.TP+c.FN+c.FP+c.TN;return [[c.TP+c.TN,m],[c.TP,c.TP+c.FN],[c.TN,c.TN+c.FP],[c.TP,c.TP+c.FP],[2*c.TP,2*c.TP+c.FP+c.FN]];},A=mets(C),B=mets(C0);
      // แถบ metric แบบเดียวกับ 1-D Bayes: ชื่อ + สูตร | ค่า % · แถบเข้ม = threshold ปัจจุบัน · แถบจาง + เลขเล็ก = ที่ p̂ ≥ 0.50 · ลูกศร = สูง/ต่ำกว่าค่าอ้างอิง
      var NM=['Accuracy','Sensitivity','Specificity','Precision','F_1'],
          FMs=['('+cs('TP')+'+'+cs('TN')+')/n',cs('TP')+'/('+cs('TP')+'+'+cs('FN')+')',cs('TN')+'/('+cs('TN')+'+'+cs('FP')+')',cs('TP')+'/('+cs('TP')+'+'+cs('FP')+')','2PR/(P+R)'];
      // โหมด x: แถบกรมท่าล้วน (แบบ 1-D Bayes) ไม่เปรียบเทียบ · โหมด p̂: เทียบกับ p̂ ≥ 0.50 แบบ Data Drift — สีแถบ+ตัวเลข เขียว = ไม่ต่ำกว่าค่าอ้างอิง · แดง = ต่ำกว่า · แถบจาง + "at 0.50 …%" = ค่าอ้างอิง
      var cmp=!isEX(),Gc='#3F8F6B';
      var bar=function(i){var a=A[i],b=B[i],ok=a[1]>0,v=ok?a[0]/a[1]:0,rk=b[1]>0,r=rk?b[0]/b[1]:0,col=!cmp?MC:(v<r-0.005)?Rd:Gc;
        return '<div class="mbar"><div class="nm"><span class="lab">'+kx((i===4?'F_1':'\\text{'+NM[i]+'}')+'\\;'+FMs[i])+'</span><span class="v" style="color:'+col+'">'+kx(ok?Math.round(v*100)+'\\%':'\\text{--}')+'</span></div>'
          +'<div class="trow"><div class="track">'+(cmp?'<span class="trainbar" style="width:'+(r*100)+'%;background:'+col+'"></span>':'')+'<span class="fill" style="width:'+(v*100)+'%;background:'+col+'"></span></div>'
          +(cmp?'<span class="tr">'+kx('\\text{at }0.50\\;\\,'+(rk?Math.round(r*100)+'\\%':'\\text{--}'))+'</span>':'')+'</div></div>';};
      document.getElementById('mbars').innerHTML='<div class="mcol">'+bar(1)+bar(2)+bar(3)+'</div><div class="mcol">'+bar(0)+bar(4)+'</div>';}
    else if(k==='roc'){
      rows=[['\\text{TPR}',fr(cs('TP'),cs('TP')+'+'+cs('FN')),vv(tp,tp+'+'+fn,TP,TP+FN)],
            ['\\text{FPR}',fr(cs('FP'),cs('FP')+'+'+cs('TN')),vv(fp,fp+'+'+tn,FP,FP+TN)],
            ['\\text{thresholds}','n+1',String(n+1)],
            ['\\text{AUC}','P(\\hat p_+>\\hat p_-)',R.auc.toFixed(2)]];
      // AUC คิดมือ 2 ทาง: (1) รวมพื้นที่สี่เหลี่ยมคางหมูใต้ ROC เฉพาะช่วงที่ FPR ขยับ (2) นับคู่ (+,−) ที่จัดอันดับถูก
      var parts=[],pt=R.pts,i,dfs=[],avs=[];for(i=1;i<pt.length;i++){var df=pt[i].f-pt[i-1].f;if(df>1e-12){dfs.push(df);avs.push((pt[i-1].t+pt[i].t)/2);parts.push('\\tfrac12('+pt[i-1].t.toFixed(2)+'+'+pt[i].t.toFixed(2)+')('+df.toFixed(2)+')');}}
      // ถ้า ΔFPR เท่ากันทุกช่วง (= 1/n−) ย่อเป็น ΔFPR · (ผลรวม TPR เฉลี่ยของแต่ละช่วง) ให้สั้นลง
      var same=dfs.length>1&&dfs.every(function(v){return Math.abs(v-dfs[0])<1e-9;});
      if(same)parts=['\\Delta\\mathrm{FPR}\\textstyle\\sum\\overline{\\mathrm{TPR}}=\\tfrac{1}{'+Math.round(1/dfs[0])+'}\\times'+avs.reduce(function(s,v){return s+v;},0).toFixed(2)];
      else if(parts.length>3)parts=[parts[0],parts[1],'\\cdots',parts[parts.length-1]];   // ช่วงไม่เท่ากันและมีหลายช่วง → แสดง 2 พจน์แรก … พจน์สุดท้าย
      var win=0,tie=0,a,b2;for(a=0;a<D.pos.length;a++)for(b2=0;b2<D.neg.length;b2++){if(D.pos[a]>D.neg[b2])win++;else if(D.pos[a]===D.neg[b2])tie++;}
      var np=D.pos.length*D.neg.length;
      function ln(ps){return '<span class="ln">'+ps.map(function(p){return '<span>'+kx(p)+'</span>';}).join('')+'</span>';}
      note=ln(['\\text{area: AUC}='].concat(parts.map(function(p,j){return (j?'+':'')+p;})).concat(['='+R.auc.toFixed(2)]))
          +ln(['\\text{ranking: AUC}=\\dfrac{\\#(\\hat p_+>\\hat p_-)+\\frac12\\#\\text{ties}}{n_+\\,n_-}','=\\dfrac{'+win+(tie?'+\\frac12\\cdot'+tie:'')+'}{'+D.pos.length+'\\cdot'+D.neg.length+'}','='+((win+tie/2)/np).toFixed(2)]);}
    var h='';rows.forEach(function(r){h+='<tr>'+r.map(function(c,j){return '<td'+(j>=2?' class="r"':'')+'>'+kx(c)+'</td>';}).join('')+'</tr>';});
    document.querySelector('#grp-met .tblbox').style.display=(k==='thr')?'none':'';document.getElementById('mbars').style.display=(k==='thr')?'':'none';
    document.getElementById('mbody').innerHTML=h;
    var an=document.getElementById('aucnote');if(an){an.innerHTML=note;an.style.display=note?'':'none';}}

  function curT(){return isEX()?TMEM.ex:TMEM.p;}   // ค่า threshold เต็มความละเอียด (ค่าใน input ถูกปัดทศนิยม → จุดที่ p̂ = t พอดีจะหลุด)
  function upd(){var t=curT(),C=confusion(t),R=roc(),k=T().key;
    document.querySelector('.main').className='main'+(k==='roc'?' roc':'');
    document.getElementById('stage').className='stage'+(isEX()?'':' wide');
    document.getElementById('scSeg').style.display=(k==='roc')?'none':'';
    var gm=document.getElementById('grp-met');gm.style.display='';   // metric ทุกแท็บ: ex/thr ใต้กราฟ · roc ในแผงควบคุม (ใต้กราฟมี ROC แล้ว)
    var host=(k==='roc')?document.querySelector('.panel'):document.querySelector('.main');if(gm.parentElement!==host)host.appendChild(gm);
    drawStrip(t,C);if(k==='roc')drawRoc(t,R);fillTable(C,R);fillLegend();fillDtab(t);}

  // ---------- controls ----------
  function setDsSeg(){var bs=document.querySelectorAll('#dsSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(parseInt(bs[i].getAttribute('data-ds'),10)===dsIdx)?'on':'';}
  // ช่วง threshold: Example = ช่วงข้อมูล (D.lo–D.hi) · p̂ = 0.05–0.95 (สุดขอบกว่านี้ทุกจุดถูกทำนายเหมือนกันหมด)
  // slider p̂ ใช้ step=any (ค่าต่อเนื่อง แสดง 2 ตำแหน่ง) เพราะ p̂ อิ่มตัวใกล้ 0/1 — กริด 0.01 แยกจุดปลายหางไม่ได้ ทำให้สลับ x ↔ p̂ แล้ว confusion matrix เพี้ยน
  function setTRange(){var e=isEX(),lo=e?D.lo:0,hi=e?D.hi:1;/* p̂: 0–1 รวมปลายทั้งสอง */['Rt','Nt'].forEach(function(id){var el=document.getElementById(id);el.min=lo;el.max=hi;el.step=e?0.1:(id==='Rt'?'any':0.01);});
    if(TMEM.ex===null)TMEM.ex=Math.round((D.lo+D.hi)/2*10)/10;TMEM.ex=Math.min(D.hi,Math.max(D.lo,TMEM.ex));
    if(TMEM.src==='x')TMEM.p=matchT(true,TMEM.ex);else TMEM.ex=matchT(false,TMEM.p);
    document.getElementById('Rt').value=e?TMEM.ex:TMEM.p;document.getElementById('Nt').value=e?TMEM.ex.toFixed(1):TMEM.p.toFixed(2);}
  // threshold เทียบเท่าบนอีกแกน (p̂ เพิ่มตาม x): x→p̂ ใช้สูตรเดียวกับที่คำนวณ p̂ ของจุด · p̂→x ปัดขึ้นกริด 0.1 (x ทุกจุดอยู่บนกริด) → confusion matrix ไม่เปลี่ยนเมื่อสลับ
  function matchT(fromX,t){var M=D.model;
    if(fromX)return sig(M.w*(t-M.mid)+M.b0);
    if(t<=0)return D.lo;if(t>=1)return D.hi;
    var xc=(Math.log(t/(1-t))-M.b0)/M.w+M.mid;return Math.min(D.hi,Math.max(D.lo,Math.ceil(xc*10-1e-7)/10));}
  function applyTab(k){curTab=k;var btns=document.querySelectorAll('.tabbtn');for(var i=0;i<btns.length;i++)btns[i].className='tabbtn'+(i===k?' on':'');renderTexts();dataset();setTRange();upd();}
  var tb=document.getElementById('tabs');
  TABS.forEach(function(t,i){var el=document.createElement('button');el.className='tabbtn';K(t.n,el);el.addEventListener('click',function(){applyTab(i);});tb.appendChild(el);});
  ['n','t'].forEach(function(b){var Re=document.getElementById('R'+b),Ne=document.getElementById('N'+b);
    function after(){if(b==='t'){if(isEX()){TMEM.ex=gv('t');TMEM.src='x';TMEM.p=matchT(true,TMEM.ex);}else{TMEM.p=gv('t');TMEM.src='p';TMEM.ex=matchT(false,TMEM.p);}}if(b==='n'){dataset();setTRange();}upd();}
    Re.addEventListener('input',function(){Ne.value=(b==='t')?parseFloat(Re.value).toFixed(isEX()?1:2):Re.value;after();});
    Ne.addEventListener('input',function(){Re.value=Ne.value;after();});});
  document.querySelectorAll('#dsSeg button').forEach(function(b){b.addEventListener('click',function(){dsIdx=parseInt(b.getAttribute('data-ds'),10);setDsSeg();dataset();setTRange();upd();});});
  document.querySelectorAll('#scSeg button').forEach(function(b){b.addEventListener('click',function(){scMode=b.getAttribute('data-sc');
    var bs=document.querySelectorAll('#scSeg button');for(var i=0;i<bs.length;i++)bs[i].className=(bs[i]===b)?'on':'';renderTexts();dataset();setTRange();upd();});});
  document.getElementById('resample').addEventListener('click',function(){seed=(seed*1664525+1013904223)>>>0;regen(seed);dataset();setTRange();upd();});
  window.addEventListener('resize',function(){upd();});

  renderTexts();setDsSeg();applyTab(0);
  requestAnimationFrame(function(){renderTexts();upd();});
  setTimeout(function(){renderTexts();upd();},300);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){upd();});
})();
</script>
